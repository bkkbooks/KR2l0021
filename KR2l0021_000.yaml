body:
  text: 拜命凡六條省已克性之偏戒貪民職不宜泛授心誠愛民智無不及法律為師上任凡六條事不預知難以應卒受謁治官如治家瘴說禁家人侵漁告廟聽訟凡十條察情弭訟勿聽讒親族之訟宜緩别強弱待問者勿停留㑹問妖言民病如已病移聽御下凡五條御吏約束待徒隸省事威嚴宣化凡十條先勞申舊制明綱常勉學勸農服逺恤鰥寡戢強示勸毁淫祠卷下愼獄凡十條存恕獄詰其𥘉詳讞視尸囚糧巡警按視哀矜非縱囚自責救荒凡九條捕蝗多方救賑預備均賦祈禱不可奴妾流民救焚尚德上災異事長凡六條各守涯分寧人負我處患難分謗以禮下人不可以律己之律律人受代凡六條郊迎新代克終不競不可自鬻告以舊政完歸居間凡六條輕去就致政進退皆有為以義處命求進於已風節牧民忠告目録終風憲忠告序曩聞崇安令從吉甫能以忠信使民民亦樂其治豫過崇安㑹從吉問所治何先即出書一卷曰某不敏粗效一官者此書之力也豫閲其書則相國張文忠公為縣令時所著采比古人嘉言善行自正心倄身以至事上惠下擲姦決疑恤隱治賦凡可為郡縣楷式者無不曲盡其宜且蕳而易行約而易守名之曰牧民忠告及余客亰師嘗于臺臣之家見所謂風憲忠告者言風紀要務凡十章亦公為御史時所著也今年余謁閩海監憲莊公出風憲忠告將鋟梓以廣其傳㑭余序之余得重觀是書則歎曰文忠真仁人也仁者恥獨善於已已為令長得牧民之道𣣔使天下牧民之吏人人盡其道已為憲臣能振紀綱慎舉刾言人所難言欲使天下為憲臣者人人皆然公其心于天下而不私其身雖令尹子文之忠不及此也傳曰仁人之言其利博哉是書可謂仁人之言矣時文忠公之子引來僉閩憲克濟世德亦至正乙未秋林泉生序風憲忠告目録自律苐一示教苐二詢訪苐三按行苐四審録苐五薦舉苐六紏彈苐七奏對苐八臨難苐九全莭苐十右風憲忠告苐録如上先臣養浩所著也伏惟丗祖皇帝䢖御史臺將以舉賢良紏姦慝察竒邪兼古諌官之職復置肅政廉訪司于外朝廷倚之而益尊視古之風憲尤重矣故先臣此書㦯可為執法者之助今上皇帝作新庶政思致太平謹繕寫上進至正元年十一月日前承直郎祕書監祕書郎臣張引昧死上廟堂忠告目録修身第一用賢第二重民第三逺慮第四調燮第五任怨第六分謗第七應變第八獻納第九退休第十右廟堂忠告第録如上先臣養浩之所著也惟聖天子臨御萬方明良相逢天下之人思見太平之徴則先臣此書可以出矣嗚呼古人居廟堂之上者有若臯䕫稷契伊傅周召其事功猶可稽諸簡䇿誠能因此書遡而求之則道揆法守於是乎在矣至正元年十一月前承直郎祕書監祕書郎臣張引昧死上
