front:
  text: 牧民忠告序牧民忠告者濱國張文忠所著書也公以道德政事名于天下其為學則卓乎有所見而不雜于權術其操行則確乎有所守而不奪于勢利凡見諸論議文字之閒施諸動靜云為之際蓋無一不本于仁義孝弟之心也故自為縣令為御史為參議中書為中丞西臺皆即其所行著之簡策有曰風憲忠告曰廟堂忠告而牧民忠告則為令時著也閒嘗盡得而讀之廢書而歎曰是何忠厚之至哉因記弱冠時先子文靖府君語師泰曰我昔在朝當皇慶延祐閒人物最盛一時相知固不少然求其志同道同者莫清河元復初濟南張希孟若也二人嘗聯鑣過我慷慨論議曰􅉴不忍舍去且相顧曰世豈復有相得如吾三人孰先死則後死者當銘諸使子孫丗丗無相忘也後三十年師泰承乏閩海憲使而公之子惟逺亦僉司事閒語其故則相對悽愴不巳遂請此書剝諸學宫以規夫牧民者嗚呼數年以來州郡多故黎民瘡痍每思一賢守令以安靖吾民而不可得乃知忠告之有補于丗教也深矣使天下之為守令者家藏一書遵而行之雖單父武城之化不外是矣奚漢循吏之足論哉至正十五年秋九月後學宣城貢師泰序牧民忠告目録卷上
