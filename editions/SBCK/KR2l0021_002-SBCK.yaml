front:
  text: 牧民忠告卷下
  hash: sha256:7d1c2db34bfb38fa7f4a005c222773c251f339554e17ac8dce6103c9fecc7d5e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2l0021_SBCK_002-1a}
body:
  text: 齊東野人張養浩愼獄第六凢十條存恕人之良孰願爲盗也由長民者失於教養凍餒之極遂至於此要非其得已也甞潜体其然使父飢母寒妻子愠見徴􅀒旁午疹疫交攻萬死一生朝不逮暮於斯時也見利而不囬者能幾何人其或因而攘竊不原其情輙置諸理嬰笞関木彼固無辭然百需叢身孰明其不獲巳哉古人謂上失其道民散乆矣如得其情則哀矜而勿喜嗚呼人能以是論囚雖欲􅃤酷亦必有所不忍矣獄詰其􅀄獄問􅀄情人之常言也蓋獄之􅀄發犯者不暇藻飾問者不暇鍜錬其情必眞而易見威以臨之虚心以詰之十得七八矣少萌姑息則其勞將有百倍厥􅀄者故片言折獄聖人惟與乎子路其難可知矣詳讞在獄之囚吏案雖成猶當詳讞也若酷吏鍜錬而成者雖讞之囚不敢異辭焉須盡辟吏卒和顔易氣開誠心以感之或令忠厚獄卒欵曲以其情問之如得其􅁈立爲辨白不可徒拘閡吏文也噫姦吏舞文何所不至哉視屍故事承檢屍之牒則劃時而行重人命也其或行焉而後時時焉而不親蒞親焉而不精詳罪皆不輕也其檢之之式又當徧者筮仕者不可以不知囚糧天地之德曰好生聖元體之以有天下諸在縲紲無家者皆給之粮惟縣獄不給也意者縣非待報之官府故令畧詰其然而上之州比見爲州者往往爲吏之所欺吹求不受以致瘐死於縣獄夫罪不至死而以已私繆殺之不仁甚矣爲州若府者尚深戒之巡警詰盗非難而警盗爲難警盗非難而使民不爲盗􅀹難蓋天下之事先其幾爲之則有餘後其幾爲之則艱苦而無益夫盗之發也􅁪岀不虞知者防於未然其防之之術則在廣耳目嚴巡邏戒飲􅀶幾游聚或旬或月即命尉行境以恐懼之夫盗猶鼠也尉猶捕鼠之狸也勤於岀鼠必伏而不動狸怠出則鼠必興矣彼爲尉者與其勞於已然孰若警於未發之爲愈若夫使民不爲盗則又在於勤本以致富勤斯富富斯禮義生禮義生雖駈之使竊亦必不肯爲之矣故管子謂倉廪實而知禮節衣食足而知榮辱諒哉按視獄庭時當一至也不惟有以安衆囚之心亦使司獄卒吏輩知所警畏而無飲􅀶喧嘩逸而反獄者是亦先事防之之㣲意也倉庫同哀矜亡友段伯英甞尹鉅野民有犯法受刑者每爲泣下或以爲過余聞之私自語曰人必有是心然後可以語王政且獨不聞古人亦有禁人於獄而不家寢者乎要皆良心之所發非過也非縱囚古人縱囚省親如期還獄者甚多要不可以爲法也夫法者天子之所有而民或犯之是犯天子之法也而彼乃與期而縱之是不幾於弄天子之法以掠美市恩於下者乎然出於朝廷則可出於一已之私則不可自責教民不至則犯禁者多養民無術則病飢者衆爲守與牧而使其至此獨歸咎於民難矣哉救荒第七凢九條捕蝗故事蝗生境内必馳聞於上少淹頃刻所坐不輕然長民者亦須相其小大多寡爲害輕重若遽然以聞蒞其上者群集族赴供張徴索一境騷然其害反甚於蝗者其或勢㣲種穉則當亟率衆力以圖之不必因細虞以來大難於民也故凢居官必先敢於􅀒荷而後可以有爲多方救賑天所􅂌人富與貴者非欲其自􅁉蓋將使推所有以濟人之不及也飢者食之寒者衣之斯不􅀒天􅂌之富矣直者舉之枉者錯之斯不􅀒天􅂌之貴矣然富貴而能若是者其恵在人而善則在已名爲惠人實自惠也故古之有民社者或不幸而值㐫荒夭扎之變視其輕重必有術以處之或私帑之分或公廪之發或託之工役或假以山澤或已􅀒蠲征募糴勸糶或聽民收其遺稚或命醫療其疹疾凡可以拯其生者靡㣲不至蓋古人視民如子天下未有子在難而父母坐視不救之理也嗚呼凡牧民者其以古之人爲法庻無彼我之間哉預備灾異之生常岀於人之所不意誠素有其備雖甚灾不足爲憂也今州郡多無委積雖有之而在上者封錮甚嚴不測有虞茫無所措手此厥今牧民者之通患也然今所謂祗應之錢者山州僻縣未甞有之而使客往還率無枵腹而過者意必有以規畫也至於備荒之儲獨未有及焉者豈以治平之時何遽有此所以因仍嵗月幸滿而去不復爲民逺慮耶甞聞近代爲縣者教民種蔓菁搗其根以爲餅大者三四斤乾而儲之後值㐫年蒸以食飢民味甘且美頼以全活者甚衆夫古人慮民之逺也如此其肯苟且幸代而不爲民預備哉均賦故事民之稅賦三年則第其貧富而均平之或好名未及而先爲或避謗踰期而不爲皆非也如期行之民受賜不淺矣祈禱凢有祈禱不必勞衆齋居三日以思已愆民有􅁈歟己有􅂍歟政事有未善歟報國之心有未誠歟無則如儀行事有則必俟追攺而後禱焉夫動天地感􅀑神非至誠不可纎毫之慝未除則彼此邈然矣不可奴妾流民甞見一顯官於㐫年市所部民子女殆數十餘人美且壯者皆奴妾之餘將賂時要以希恩寵也僕聞而顰蹙曰使其困憊吾治巳得罪矣又不能救而反奴妾之不大獲罪於法耶故感而書之以戒後來者救焚民或失火則伐鼓集衆親蒞以救之惻隠之心人所共有誠能鼓舞以作其氣雖仇人亦將焦頭爛額而相趨患難矣尙德反風㓕火虎渡河蝗不入境全境之水囬流此在長民者之德何如爾殆不可皆謂之偶然也上災異災異之事則不可不聞祥瑞雖不上可也事長第八凢五條各守涯分尊卑之分定則家無逆子國無叛臣夫國之所以亡家之所以敗皆由卑不有尊而尊不能制卑之所致也考諸歴代厥監甚明今夫上而朝廷下而郡邑其設官也有長焉有貳焉有幕属焉有胥吏焉各安其分而事其事天下安有不治者哉惟其小智自私乖同夤之義無恊恭之誠􅂨旣不和則所見必有不同者或長官不知待佐貳之禮也或佐貳闇於事長官之道也少見辝色則彼此胥失矣若夫事例應爾而所見或不同居下者當誠其意婉其辝卑其容体以開其上若由未允則俟其退而語之家人非木石無不囬之理其或居下者有所不可爲長者亦當如是曉之也稍有所挾雖面強從退而必有不堪者日引月深終於􅂥露人見其乖忤也䜛譛之言乘之而入乆則訟必興而政事隳矣爲一時之忿使同僚之心離闔境之民不得治則其人之褊淺可知矣古人有言必有忍乃其有濟又曰欲成大事必須少忍又曰忍爲衆妙之門㫖哉寧人􅀒我寧人􅀒我無我􅀒人此待巳之道也天下之善不必已出此待人之道也能行斯二者於道其庶幾乎處患難凡在官者當知榮與辱相􅀝伏得與失相勝􅀒成與敗相循環古今未有榮而無辱得而無失成而無敗之理也雖天地之運隂陽之化物理人事莫不皆然䖏之不以道則纎毫之寵必揺而一唾之辱必剉矣故君子於外物重􅁿皆所不恤顧其在我者何如爾使其有可辱雖不加譴而君子恒以爲不足使其無可辱雖置之死地而君子恒以爲有餘歴􅀚自昔大聖大賢不幸横罹禍患恬然不易其素者灼乎此而巳矣茍惟能䖏榮而不􅀎處辱惟􅀎安順境而逆境則不􅀎一朝居欲望其臨政有餘爲難矣嗚呼善􅀚人者其於此焉察之分謗是非毁譽自古爲政所不􅀎無者是則歸人非則歸已聞譽則歸人聞毁則歸已無長無貳䖏之皆當如是也前軰云㤙欲已出怨將誰歸嗚呼此真􅀶大君子之言也以禮下人夫能下人者其志必髙其所至必逺昔某郡有新守􅄶驁大不禮其下常令掾属羅拜於庭下有一賢掾初以疾在告疾愈當庭參是日偶大雨守命張傘布茅於庭下使掾拜焉掾恬然不動容興伏惟謹識者知其他日必爲宰相也後果然不可以律已之律律人同官有過不至害政宜爲包容大抵律已當嚴待人當恕必欲人人同已天下必無是理也受代第九郊迎新代聞代者來則避所居而郊迎之不可以其代已也而疾之而薄之而不以舊政告之也大抵天下之善在彼猶在此勸人爲善即已之爲善也詎可惟許已爲善而不願他人爲善哉克終爲政者不難於始而難於克終也􅀄焉則銳中焉則緩末焉則廢者人之情也愼終如始故君子稱焉不競甞見丗之交代者多有所争要皆舊官不廣之所致或據其居而不徙或專其田而不分或匿其公物不盡以相授使新者懐不平而無所訴甚非士君子善後之道也夫利之與義勢不並處義親則利䟽利近則義逺况爲民師帥而專務於利其聚怨納侮視市井小人不若也故君子之從政也寧公而貧不私而富寜讓而損已不競而損人不可自鬻代之未至也風民立石以頌德結綺門以祖行鳩錢帛以佐路費建生祠以圖不朽之名皆非士君子之事也蓋爲善不求人知者爲上知而不自有其善者次之呶呶焉自媒自鬻惟崇虚譽者風斯在下矣告以舊政近代東原吴曼慶爲某所憲長旣代諄諄新上者曰某事有少許未完某獄已具而未决某按有如是可疑某人有許能可用一部之政毫分縷析惟恐其不知知之惟恐其不盡嗚呼今之仕者方其在職尚不肯用心况已代去而敢責其如是哉完歸其在政也民被德澤訟清盗息豪強消沮同僚恱服則去之之日雖弊車羸馬行橐蕭然其樂有不翅萬金獲而千駟受者前輩由外官而至執政者論濟人之功皆自以爲不及爲縣逺甚嗚呼有志及物者其勿薄州縣而不屑爲也閑居第十凢五條輕去就士之仕也有其任斯有其責有其責斯有其憂任一縣之責者則憂一縣任一州之責者則憂一州任一路之責天下之責者則以一路與天下爲憂也蓋任重則責重責重則憂􅀷古之人所以三揖而進一揖而退者有以也雖堯舜禹湯文武之爲君臯䕫稷契伊􅀓周召之爲臣固未甞不憂其責而以位爲樂也若以位爲樂者苟其位者也嗚呼大聖大賢宜不難於其所任猶且不自暇逸如此吾才逺不逮聖賢顧可樂其位而重其去也哉致政古人以休官致政爲釋重􅀒而脫覊囚切甞思之誠有是理方其仕也嚴出入而慎起居一嚬一􅀏亦不敢以輕假人蓋一身而爲衆師表少踰規矩謗議四聞譬之特行於高屋之上自頂至踵在下者無不見之也一朝代至完身而去詎止如釋重􅀒脫覊囚而已哉甞見仕而休居者往往不喜或命子姪或託朋友市奸搆訟靡政不及小有所違則曰去官同見任使新上者法格令㢮拒納惟谷甚而撓沮排觝爲狀百端細民無知亦從而靡設使已政之􅀄人以是荐擾當若何推心體之必自知其可惡矣進退皆有爲進則安居以行其志退則安居以脩其所未能則是進亦有爲退亦有爲也近丗士大夫惟狃於進退則惽然無所猷爲甚而茹愧懐慙蹙縮不敢一岀户夫軒冕古人以爲儻來之物也其有也何所加其無也何所損不思良貴在我惟假於物以爲重輕焉則其人品之卑下不待論而可知矣以義處命丗俗以窮逹進退皆本夫命謂命之窮者雖竭蹶求進而亦窮命之逹者雖逺逝深藏而亦不能退此星翁術士之常談非君子所尚也君子則以義處命而不􅀝命以害義可以進則進可以退則退吾不謂命也樂則行之憂則違之吾豈謂命哉彼淪胥富貴利逹之境而不能岀者則往往託命以自誣宜乎接武禍機而卒不能悟悲夫求進於已士當求進於已而不可求進於人也所謂求進於已者道業學術之精是已所謂求進於人者富貴利逹之榮是已蓋富貴利逹在天而不可求道業學術在我而不可不求也况古之人不以富貴利逹爲心也其所以從仕者宜假此以行道也道不行而富貴利逹者古人以爲恥而不以爲榮嗚呼非誠有致君澤民之心者其孰能與於此風節名節之於人不金幣而富不軒冕而貴士無名節猶女不貞則何􅁀不從何炎不附雖有他美亦不足贖也故前輩謂爵禄易得名節難保爵禄或失有時而再來名節一􅃜終身不復矣嗚呼士而居閑者能以此言銘其心庶不易所守而趨勢要哉卷下
