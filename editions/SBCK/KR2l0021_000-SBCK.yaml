front:
  text: 牧民忠告序牧民忠告者濱􅀦張文忠􅀁著書也公以道徳政事名扵天下其為學則卓乎有􅀁見而不􅄂扵權術其操行則確乎有􅀁守而不奪扵勢利凡見諸論議文字之閒施諸動静云為之際盖無一不本扵仁義孝弟之心也故自為縣令為御史為叅議中書為中丞西臺皆即其􅀁行著之􅂤筞有曰風憲忠告曰廟堂忠告而牧民忠告則為令時著也閒嘗盡得而讀之廢書而歎曰是何忠厚之至㢤因記弱冠時先子文靖府君語師泰曰我昔在朝當皇慶延祐閒人物㝡盛一時相知固不少然求其志同道同者莫清河元復初濟南張希孟若也二人甞聯鑣過我慷慨論議曰􅉴不忍􅃕去且相頋曰世豈復有相得如吾三人孰先死則後死者當銘諸使子孫丗丗無相忘也後三十年師泰承乏閩海憲使而公之子惟逺亦僉司事閒語其故則相對悽愴不巳遂請此書剝諸學宫以規夫牧民者嗚呼數年以来州郡多故黎民瘡痍每思一賢守令以安靖吾民而不可得乃知忠告之有補扵丗教也深矣使天下之為守令者家蔵一書遵而行之雖單父武城之化不外是矣奚漢循吏之足論㢤至正十五年秋九月後學宣城貢師泰序牧民忠告目録卷上
  hash: sha256:75fc7c6f5275883e56c3b320bd8d1fa95c5eef8a95b44bab38ddcf49f3610b88
