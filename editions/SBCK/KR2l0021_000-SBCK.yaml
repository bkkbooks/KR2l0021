body:
  text: 拜命凢六條省已克性之偏戒貪民職不宜泛授心誠愛民智無不及法律爲師上任凢六條事不預知難以應卒受謁治官如治家瘴􅀃禁家人侵漁告廟聽訟凢十條察情弭訟勿聽讒親族之訟宜緩别強弱待問者勿停留㑹問妖言民病如已病移聽御下凢五條御吏約束待徒􅀠省事威嚴宣化凢十條先勞申舊制明綱常勉學勸農服逺恤鰥寡戢強示勸毁淫祠卷下愼獄凢十條存恕獄詰其􅀄詳讞視屍囚粮廵警按視哀矜非縱囚自責救荒凢九條捕蝗多方救賑預俻均賦祈禱不可奴妾流民救焚尚德上災異事長凢六條各守涯分寧人􅀒我處患難分謗以禮下人不可以律己之律律人受代凢六條郊迎新代克終不競不可自鬻告以舊政完歸居閑凢六條輕去就致政進退皆有爲以義處命求進於已風節牧民忠告目録終風憲忠告序􅇮聞崇安令􅀙􅁻甫􅀎以忠信使民民亦樂其治予過崇安㑹􅀙􅁻問􅀁治何先即出書一􅃃曰某不敏粗効一官者此書之力也予閱其書則相􅀦張文忠公為縣令時􅀁著采比古人嘉言善行自正心倄身以至事上恵下擿姦決疑䘏􅀮治賦凡可為郡縣楷式者無不曲盡其宜且蕳而易行約而易守名之曰牧民忠告及余客亰師甞扵臺臣之家見􅀁謂風憲忠告者言風紀要務凡十章亦公為御史時􅀁著也今年余謁閩海監憲荘公出風憲忠告􅀅鋟梓以廣其傳㑭余序之余得重􅀚是書則歎曰文忠真仁人也仁者恥獨善於已已為令長得牧民之道􅁒使天下牧民之吏人人盡其道已為憲臣􅀎振紀綱慎舉刾言人􅀁難言欲使天下為憲臣者人人皆然公其心扵天下而不私其身雖令尹子文之忠不及此也傳曰仁人之言其利博㢤是書可謂仁人之言矣時文忠公之子引来僉閩憲克濟世徳亦至正乙未秋林泉生序風憲忠告目錄自律苐一示教苐二詢訪苐三按行苐四審録苐五薦舉苐六紏彈苐七奏對苐八臨難苐九全莭苐十右風憲忠告苐録如上先臣養浩􅀁著也伏惟丗祖皇帝䢖御史􅄗􅀅以舉賢良紏姦慝察竒衺兼古諌官之職復置肅政㢘訪司于外朝廷􅀝之而益尊視古之風憲尤重矣故先臣此書㦯可為執法者之助今上皇帝作新庶政思􅃱太平謹繕冩上進至正元年十一月日前承直郎秘書監秘書郎臣張引昧死上廟堂忠告目録脩身第一用賢第二重民第三逺慮第四調爕第五任怨第六分謗第七應變第八獻納第九退休第十右廟堂忠告第録如上先臣養浩之所著也惟聖天子臨御萬方明良相逢天下之人思見太平之徴則先臣此書可以出矣嗚呼古人居廟堂之上者有若臯䕫稷􅆻伊傅周召其事功猶可稽諸簡䇿誠能因此書遡而求之則道揆法守於是乎在矣至正元年十一月前承直郎秘書􅁥秘書郎臣張引昧死上
