front:
  text: 牧民忠告卷上
  hash: sha256:0daba9bcd38be5583ce93a2058d947f77405a08cbb3dfe9a2851cdb851863604
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2l0021_SBCK_001-1a}
body:
  text: 齊東野人張養浩拜命第一凢六條省已命下之日則拊心自省有何勲閥行能膺兹異數苟要其廪禄假其威權惟濟己私靡思報國天監伊邇將不汝容夫受人直而怠其工儋人爵而曠其事已則逸矣如公道何如百姓何克性之偏夫及物之心人孰不有第材質強劣有所不同苟即其所短而痛自克治則官無難爲事無不集者矣㢮緩克之以敏浮薄克之以莊率略克之以詳煩苛克之以大體苟不度所任一循已之偏而處之鮮有不敗者矣古人佩弦佩韋亦皆此意今人往往讀書無益蒞官不才者皆由狃於習而不知痛自克治故也戒貪普天率土生人無窮也然受國寵靈而爲民司牧者能幾何人旣受命以牧斯民矣而不能守公廉之心是自不愛也寧不爲丗所誚耶况一身之㣲所享能幾厥心溪壑適以自賊一或罪及上􅀌國恩中貽親辱下使郷隣朋友䝉詬包羞雖任累千金不足以償一夕縲紲之苦與其戚於已敗曷若嚴於未然嗟爾有官所宜深戒民職不宜泛授今選官者大率重内而輕外殊不知漢宣帝所以富民唐太宗所以家給人足皆由重牧民之長故也嗚呼牧民之長其重若此乃泛焉而選懵焉而授奚爲不是慮也哉心誠愛民智無不及赤子之生無有知識然母之者常先意得其所欲焉其理無他誠然而巳矣誠生愛愛生智惟其誠故愛無不周惟其愛故智無不及吏之於民與是奚異哉誠有子民之心則不患其才智之不及矣法律爲師吏人蓋以法律爲師也魏相所以望隆當丗者漢家典故無所不悉也凢學仕者經史之餘若國朝以來典章文物亦須備考詳觀一旦入官庶不爲俗吏所迂也上任第二凢六條事不預知難以應卒比入其境民瘼輕重吏弊深淺前官良否強宗有無控訴之人多與寡皆須盡心詢訪也至則逺居數舎召掌之者語其詳䟽其槩先得其情下車之日叅考以斷若素無所備率然至部聽訟之際百姓聚觀一語乖張則必貽􅀏闔境况民心易動尤在厥􅀄􅀄焉無以厭服其心後雖有爲亦將奚信不然受其訟而翼日理之亦可殆不宜輕率應荅使士民失望也受謁諸執事叅謁不可黙然無一言第曰誤蒙國恩託兹重􅀉芒背汗顔期與諸君滌慮洗心以宣大化也汝或余違國有常憲非所敢私諸君其愼之治官如治家治官如治家古人甞有是訓矣蓋一家之事無緩急巨細皆所當知有所不知則有所不治也况牧民之長百責所叢若庠序若傳置若倉廥若囹圄若溝洫若橋障凢所司者甚衆也相時度力弊者葺之汗者潔之堙者䟽之缺者􅀘之舊所無有者經營之若曰彼之不修何預我事瞬夕代去自苦奚爲此念一萌則庶務皆隳矣前輩謂公家之務一毫不盡其心即爲苟禄獲罪於天瘴􅀃昔人有欲之官而惡其地之瘴者或釋之曰瘴之爲害不特地也仕亦有瘴也急催暴歛剥下奉上此租賦之瘴深文以逞良惡不白此刑獄之瘴侵牟民利以實私儲此貨財之瘴攻金攻木崇飾車服此工役之瘴盛㨂􅁎妾以娱聲色此帷薄之瘴也有一於此無間逺邇民怨神怒無疾者必有疾而有疾者必死也昔元城劉先生處瘴海而神觀愈強是知地之瘴者未必能死人而能死人者常在乎仕瘴也慮彼而不慮此不亦左乎故余具載其言以爲授官憚逺避難者之戒禁家人侵漁居官所以不能清白者率由家人喜奢好侈使然也中旣不給其勢必當取於人或營利以侵民或因訟而納賄或名假貸或託姻属宴饋徴逐通室無禁以致動相掣肘威無所施已雖日昌民則日瘁已雖日懽民則日怨由是而坐敗辱者蓋駢首驪踵也嗚呼使爲妻妾而爲之則妻妾不能我救也使爲子孫而爲之則子孫不能我救也使爲朋友而爲之則朋友不能我救也妻妾子孫朋友皆不能我救也曷若廉勤乃職而自爲之爲愈也哉蓋自爲雖闔門恒淡泊而安榮及子孫爲人雖讙然如可樂而禍患生几席也二者之間非眞知深悟者未易與言有官君子其審擇焉告廟故事牧民官旣上必告境内所當祀之神宜以不賄自爲誓庻堅其遷善之心焉爾後雖欲轉移亦必有所畏而不敢聽訟第三凢十條察情人不能獨處必資衆以遂其生衆以相資此訟之所從起也故聖人作易以訟繼師其示警固深矣夫善聽訟者必先察其情欲察其情必先審其辭其情直其辭直其情曲其辭曲政使強直其辭而其情則必自相矛盾從而詰之誠僞見矣周禮以五聲聽獄訟求民情固不外乎此然聖人謂聽訟吾猶人也必也使無訟乎蓋聽訟者折􅂨於已然苟公其心人皆可能也無訟者救過於未然非以德化民何由及此嗚呼凢牧民者其勿恃能聽訟爲德也弭訟起訟有原書訟牒者是也蓋􅃖􅃖之氓闇於刑憲書訟者誠能開之以枉直而曉之以利害鮮有不愧服兩釋而退者惟其心利於所獲含糊其是非陽解而隂嗾左縱而右擒舞智弄民不厭不巳所以厥今吏按情僞混殽莫之能信者蓋職乎此也大抵一方之訟宜擇一二老成錬事者使書之月比而季考酌其功過而加賞罰焉若夫毆詈假質凡不切之訟聽其從宜諭遣之諭之而不伏乃逹于官終無悛心律以三尺如此則訟源可清而民間澆薄之俗庶幾乎復歸於厚矣勿聽䜛徤訟者理或不勝則往往誣其敵甞謗官長也聽之者當平心易氣置謗言於事外惟覈其實而遣之庻不墮奸民計中矣親族之訟宜緩親族相訟宜徐而不宜亟宜寛而不宜猛徐則或悟其非猛則益滋其惡第下其里中開諭之斯得體矣别強弱丗俗之情強者欺弱富者吞貧衆者􅁀寡在官者多凌無勢之人聽訟之際不可不察待問者勿停留昔甞使外所過州縣待問者雲集乎門每病焉乃命一能吏簿其所告而日省之而日遣之不浹旬則訟庭閴然矣㑹問訟有相約而問者不可乘一時之忿擅加搒掠也若釋道若兵卒諸不􅀠所部者是巳妖言民有妖言惑衆者則當假以别罪而罪之如有妄書取而火之則厥跡㓕矣勿使蔓爲大獄延禍無辜民病如已病民之有訟如已有訟民之流亡如已流亡民在縲紲如已在縲紲民䧟水火如已䧟水火凡民疾苦皆如己疾苦也雖欲因仍可得乎移聽近年司憲受詞訟往往檄州郡官代聽之代聽者不可承望風㫖邀寵一時使人茹枉受刑而靡恤隂理御下第四凢五條御吏吏佐官治事其人不可缺而其勢最親惟其親故乆而必至無所畏惟其不可缺故乆而必至爲姦此當今之通病也欲其有所畏則莫若自嚴欲其不爲姦則莫若詳視其案也所謂自嚴者非厲聲色也絶其饋遺而已矣所謂詳視其案者非吹毛求疵也理其綱領而已矣蓋天下之事無有巨細皆資案牘以行焉少不經心則姦僞隨出大抵使不忍欺爲上不能欺次之不敢欺又次之夫以善感人者非聖人不能故前輩謂不忍欺在德不能欺在明不敢欺在威於斯三者度已所能而處之庻不爲彼所侮矣約束諸吏曹勿使縱游民間納交富室以泄官事以來訟端以啓倖門也暇則召集講經讀律多方覊縻之則自然不横矣待徒􅀠皂卒徒􅀠非公故勿與語非公遣勿使與民相往來若輩小人威以蒞之猶恐爲患一或解嚴必百無忌憚矣省事爲治之道其要莫如省心心省則事省事省則民安民安則吏無所資一或紛然上下胥罹其擾也然事亦有必不能省者則又在夫措畫隄防之術何如耳古人謂多筭勝少筭少筭勝無筭不特用兵爲然一役之修一宴之設一獄之興誠能思慮周詳繁略畢舉則民之受賜不淺矣某甞爲縣胥吏輩春則追農以報農桑夏則檄尉以練卒伍秋則㑹社以檢義粮冬則賦芻以飼尚馬其他若逃兵亡户逸盗及積年逋稅之民動集百餘不賄不釋某見其然常揮牘不爲署暇則將一二謹厚吏親詣其地而按之可擬者擬可行者行由是一切惟以信版集事吏人失志百姓獲安至今旁郡以爲例威嚴小而爲一邑大而爲天下賞罰明則不煩聲色而威令自行人徒知治民之難而不知治吏爲尤難蓋吏與官比詭詐易生民逺於官不能知理法誤然而犯宜若可矜吏則日處法律中非不知也小過不懲必爲大患無所忌憚矣甞聞治民如治目撥觸之則益昏治吏如治齒牙剔潄之則益利傳曰威克厥愛允濟愛克厥威允罔功法此而行斷不至於難治矣宣化第五凢十條先勞古之爲政者身任其勞而貽百姓以安今之爲政者身享其安而貽百姓以勞巳勞則民逸已逸則民勞此必然之理也憚一巳之勞而使闔境之民不靖仁人君子其忍爾乎昔子路問政而聖人告以先之勞之無倦嗚呼此真萬丗爲政之格言也歟申舊制朝廷德澤牧民者多屯而不能宣布我朝自丗祖皇帝迨今數十百年列聖相承何善不施何弊不治凢所以保國順民者討論靡遣所謂文武之道布在方􅉺但有司䆮廢而不爲申明遂爲墜典苟求掲而行之則不待他求而治道俻矣明綱常欲先教化去其斁教悖化者則善類興矣近年子叛其父妻離其夫婦姑勃蹊昆弟侮䦧奴不受主命冠屨倒置者比比皆然凡若此者不必其來告當風郷長恒紏其􅀹甚者諭衆而嚴决之則自􅋏然攺行矣勉學學校乃風化之本俗吏多忽焉不以爲務是不知天秩民彜一切治道胥此焉出暇則率僚宷以觀講習或生徒有未濟廪餼有未充􅀕物有未完教養有未至激勸有未周皆敦篤以成之乆則弦誦之聲作而禮義之俗可興矣勸農農之勤惰一􅀊之苦樂係焉其所當爲有不待勸焉者時因行治視其輟工廢業者切責之逺近聞之必知自勵也常見丗之勸農者先期以告鳩酒食􅀱郊原將迎奔走絡繹無寧蓋數日騷然也至則胥吏童卒雜然而生威賂遺徴取下及雞豚名爲勸之其實擾之名爲優之其實勞之嗟夫勸農之道無他也勿奪其時而已矣繁文末節當爲略之服逺或問逺方獠民巢居溪洞猛不能讋寛不能懐喜則人怒則獸欲宣朝廷德澤若之何而可余曰物之㐫很無虎狼若也然使之左右前後惟吾之聽者得其制之之術也夫克剛莫若柔治繁莫如簡且彼之所以反側不恒者亦必有由矣或貪其財或蹙其境或俘其子女或蔑其官属以致蟻結蜂屯肆其酷毒苟安之而不擾外之而無所事雖欲忿然無自而發政使或尓但嚴守已界恬不與校乆而彼自馴伏矣况彼兵一動守土者非有上命坐視而不敢前比許追襲則已雉兎逃而禽鳥散矣由是而論安静不競者爲上恬無所求者次之邀功生事妄開邊釁斯爲下矣官於逺方者尚監于兹恤鰥寡鰥寡􅀌獨王政所先聖人所深憫其聚居之所暇則親蒞之或遣人省視若衣粮若藥餌吏不時給者紏治之戢強或謂民有豪強則不能致治是殆爲貪邪之吏而發也夫豪強之所以敢横者由牧民者有以縱之也何也與之交私故也苟絶其私可不動聲色而使其膽落語曰其身正不令而行又曰不怒而民威於鈇􅃏信哉示勸諸民有旌表及學行異衆者時加存慰爲勸必多毁淫祠毁淫祠非燭理明而信道篤者不能非行已端而處心正者不敢牧民忠告卷上􅀴進風憲忠告臣張飬浩著自律苐一士而律身固不可以不嚴也然有官守者則當嚴扵士焉有言責者又當嚴扵有官守者焉盖法之臣􅀅以紏姦繩􅁖以粛中外以正紀綱自律不嚴何以服衆夫􅀁謂嚴如䖏子之居室一行一住一語一嘿必語禮法厥徳乃全跬歩有違則人人得而訾之茍挟權怙勢惟殖己私􅂉巧䂓子錢􅂉盗行塩帖􅂉荒躭􅎘蘖􅂉私用親属􅂉田獵不時􅂉宴遊無度􅂉潜托有司之事􅂉妄興不急之工􅂉曠官苐而弗居􅂉縦家人而不撿扵斯數者而有一焉皆足為風憲之累近年南北冨民多起宅以居勢要囙濟己私既有官舎則不必居扵彼矣夫朝􅋝以中􅄗為肅政御史為監察以憲司為㢘訪者政欲弭姦貪戢侵擾開誠布公俾􅀁属知􅀁法也今而若是牧民之吏􅀅焉法㢤且他人有犯􅁿則吾得而言之又重吾得聞扵上而僇之己之􅀁犯其孰得而發㢤恃人不敢發日甚一日􅀅如􅄗察何􅀅如天理何故余備載其然俾爲憲司者有則改之無則益知􅀁以自重示教苐二甚矣人之不可無教也生知如聖人猶胥教誨胥訓告况不􅀎聖人萬一者可忽焉而不務㢤大抵常人之情苟非其􅀁憚雖耳提面命則亦不足發其良心何則非􅀁素服素畏故也今夫庶司之軄為衆􅀁畏服者莫如風憲誠因監涖扵彼􅂉始上之日㑹􅀁属而朂之曰彼之官重者廷授次者省授又次則吏部授大小雖殊無非􅀦家臣子為人臣子姦汙不法人孰汝容夫納賄營私􅀁得甚少􅀁喪甚多與其事敗治汝曷若先事而教之為愈㢤吾之此言雖曰薄汝實厚汝也雖若毒汝實㤙汝也苟䏻如是諭之吾知退而必有率徳攺行易凶􅁖為善良者矣且刑罰不足致治教之而使不犯為治之道莫尚焉聖人謂不教而殺謂之虐又聞治扵未然者易治扵已然者難近年劉伯宣為浙西憲使䟽真西山守令四箴播告􅀁属且曰近年執憲者惟知威人以刑而不知誨人以善嗚呼劉公此言可謂仁人君子深得風憲之軆者矣詢訪苐三今為政者徃徃以先入之言為主非彼狃徇一偏盖由不通上下之情故也故通其情莫如悉心詢訪小而一縣一州大而一郡一國吏孰貪邪官孰㢘正何事病衆何政利民豪横有無風俗厚薄既得其凡他日詳加綜覈復驗以事其孰得而􅀮㢤苟㢘矣即優之禮貌之薦舉之則善者勸矣苟貪矣雖極品之貴即蔑之威拒之紏劾之則為􅁖者懲矣推而至扵待士遇吏亦莫不然大抵一道之任猶一家之務焉善為家者其子弟族属下逮奴􅀠其情性良否皆􅀁當知一􅂉不及則􅀅甘為􅀁弄而不悟乆必致是非顛倒以倿為忠以貪為㢘以無䏻為有􅀎政令不行而紀綱替矣前軰有云為宰相不難一心正兩眼明足矣烏呼彼長風憲者其責任之重亦豈下夫宰相㢤若之何不以前軰之言為法按行苐四􅀅家云多筭勝少筭少筭勝無􅄸不特用兵為然雖涖官臨政亦莫不爾夫㢘司􅀁涖之䖏一方官吏皆惕然不自安其􅀁不安者由彼為惡日久􅂲人有以發而訟之一旦故也彼既内􅀮其􅁖則必多方以求司官􅀁親之人而觧之夫司官􅀁親者曰書吏焉曰奏差焉曰緫領焉曰祗􅀱焉夫為人弥縫私罪則何求不得何請不随為司官者茍不深防預􅇱嚴為禁切萬一連己悔􅀅何及若乃司官㢘正猶􅂉庶幾其􅂉彼此胥貪弊􅀅焉救扵是乎有箕歛者有稇載者有篋笥充者有橐槖盈者微至土地􅀁宜靡不搜刮昔端州岀佳硯包孝肅公岀判於彼及其代也徒手而㱕李及知杭州絲餽縷謁不逮門由市白樂天文集终身以為慊古人持身之㢘如此况在風憲其􅀁行州郡敢假分毫之物以自溷㢤大抵憲長得人則司官不敢恣司官得人則書吏不敢恣抑聞各道公讌司官書吏奏差同堂而㘴喧譁咲謔上下不分􅀁以致彼操縦自如百無忌憚諺謂㢘訪司書吏之權跡此􅀚之信匪虗語誠䏻設法以禁之盛威以臨之小有􅀁犯即随以鞭扑如此庶使精銳消沮威福不張扵外矣凡初入風憲者不可不知審録苐五書曰庶獄庶慎又曰非侫折獄惟良折獄易謂君子眀慎用刑而不􅅏獄嗚呼于以見聖人好生之心與天地䓁矣夫飢寒切身自非深知義理之人不敢保其心之無他况􅃖􅃖之氓為守牧者教飬之不至竆而為盗是豈得巳㢤古人有以灼其然故為制也恒寛而不亟促恒哀矝而不忿疾均之為盗也而有長㓜踈戚之分均之為姦也而有夫亡夫在之殊有疾則毉藥之疾革則釋梏入人而侍之夫彼冥迷凶險之徒既麗扵理矣何足缀意而古人為制如此者則其仁恕忠厚之情可見矣昔歐陽公父治死囚之獄求其生而不得則掩卷而嘆其言曰夫常求其生猶失之死况丗常求其死㢤后之殘忍者一切不務而惟威刑之尚謂其無茹􅁈而死者吾不信也夫蒞官之法無他口威心善而已矣口威則欲其事集心善則不欲􅁿易害物况久繫之囚尤當示以慈祥召之稍前易其舊􅀁􅀠卒吏温以善色使自陳顛末情無􅀁疑然後􅂙之以按若㩀按以求其情鮮有不誤人者盖州縣無良吏􅀁以不敢信其已具之文毫釐􅂉差生死攸繋故聖人謂與其殺不辜寧失不􅀴又曰功疑惟重罪疑惟􅁿論囚之道盡扵此矣君子其慎諸薦舉苐六夫士有公天下之心然後􅀎舉天下之賢盖天下之事非一人􅀁􅀎周知亦非一人􅀁􅀎獨成必兼収博采治理可望焉故前軰謂報􅀦莫如薦賢真知要之言㢤今夫富者之扵家有田焉必求良農使之耕有貨焉必求䏻啇使之賈有牛羊焉必求善豢者使之牧何則盖彼拳拳於治家故不得不求其人也况受天下之􅀉任天下之責者乃不知求天下才共治之豈其智之不若彼富者㢤由其為􅀦之心未甞如其為家之心之切故也於此有人焉㢘而且幹雖有不共戴天之仇公論之下亦不得而掩焉苟非其人雖骨􅁏之親公論之下亦不得而私焉丗常謂風憲非親不保非仇不彈又有身為憲佐風御史薦已就陞者嗚呼委以黜陟百官之權授以儀表百司之職乃不思報效惟假之以行已私人則受其欺矣天地鬼神其受欺乎大抵求而後舉不若不求而舉之為公識而後薦不若采之輿議之為博夫已不求賢必使人之求已者皆非也盖求則不必舉舉則不必識矣故古人有聞而舉者有見而舉者有舉仇者有舉親者有集為簿者有拜其剡者有書之夹袋者雖其舉不一要極扵公當無私而已扵􅃧誠如是則為相為風憲者安有臨事乏才之嘆紏彈苐七夫臺憲之職無内外逺迩之分凡有􅀁知皆得盡言以聞扵上雖在外􅸼知居中非人紏而言之可也雖在内􅸼知外官者不法紏而言之亦可也大率惟務盡公無私斯得之矣夫人之仕也有貴近焉有踈逺焉貴近者不少貸則位卑而罪微者不待劾而艾矣故前軰謂豺狼當道安問狐狸亦此義也切甞謂薦舉之軆則冝先小官紏彈之軆則冝先貴官然又當審其素行為君子為小人如誠小人雖有􅀁長亦不必舉何則其平日不善者多也况刑憲本以待小人君子之過􅸼不至甚殆不宜􅁿易加之使數十年作飬之功掃地扵一旦也盖人才難得全才為尤難得昔趙清獻公在言路彈劾不避權貴亰師號為鐵面御史甞欲朝廷别白君子小人其言曰小人雖有小過當力排絶之後乃無患君子不幸而有詿誤則當為􅀦家保持愛護以全其徳於􅃧趙公之言可謂深識逺慮真知大軆之論矣故余表而出之以為當路者楷式奏對苐八中外之官莫難扵風憲莫危扵風憲􅂚謂難人􅀁趋者不敢趋人􅀁樂者不敢樂人􅀁私者不敢私􅀁謂嶢嶢者易缺皦皦者易汙非難而何􅂚謂危入焉與天子爭是非出焉與大臣辨可否至扵發人之姦貶人之爵奪人之官甚則罪人扵死地一􅂉不察反以為辜則終身無􅀁於訴非危而何然君子居其官則思盡其軄􅀁謂危且難者固有􅀁不避焉竭忠吐誠置死生禍福扵度外庶上不􅀒􅀦下不􅀒􅀁學其􅂉奏對於殿廷之上平心易氣惟事之陳理誠直雖従容宛轉而亦直理誠屈雖􅎨厲激切而亦屈夫悻悻其辝色非惟有失事上之体而扵已扵事悉無􅀁益古之攀䦨断鞅曵裾軔輪者皆勢危事迫不得已而為之茍事不至是殆不可執以為法前軰謂忼慨殺身者易従容就義者難体此而行則􅌸有不従者矣臨難苐九夫人臣而當􅀦家言責之任刑辱之事不敢必其無有要在順䖏靜伺以理勝之而已若乃求哀乞憐惴讋无􅀁已先撓矣何以自眀夫盡已之職為􅀦為民而得罪君子不以為辱而以為榮雖縲紲之荆楚之斧􅃏之庸何愧㢤歴觀自古䖏禍患而不乱者三代而下如子路之结纓冝僚之正色王景文之与客弈碁劉禕之自書謝表魏元忠之聞赦不動是皆有以真知義命􅀁在非區區人力􅀁得而移也然士君子平昔􅀁飬其情与僞扵焉可以見之李斯臨刑父子相泣楊子雲被收投閣㡬死王坦之與謝安齊名桓温来朝倒執手板崔浩自比子房為辨史事聲嘶股栗便溺不䏻隐此可見彼惟事名耳而扵聖賢性命之學實未甞淂諸心也善乎韓文公之言曰儒者之扵患難苟非其自取之其拒而不受扵懐也若築河堤以障屋霤其容而消之也若水之於海氷之扵夏日其玩而忘之以文辭也若奏金石以破蟋蟀之鳴故君子之學以眀理自信為貴全節苐十人之有死猶晝之必夜暑之必寒古今常理不足深訝苐為子死扵孝為臣死扵忠則其為死也大身雖没而名不没焉太史公謂死有重扵泰山有􅁿扵鴻毛非其義則不死􅀁謂重扵泰山者如其義則一切無􅀁頋􅀁謂􅁿扵鴻毛也嗚呼夫人以眇焉之身倐耳之年使之嵩華聳而星日掲者非莭義䏻尓耶况人之貴賤夀夭天􅀁素㝎而謂附此人則得官違此人則失官言事則身危不言則身无􅀁患此丗俗無知者􅀁見士君子豈以是為取舎㢤然正直亦有時而被禍者君子以為不幸奸邪亦有時而䝉福者君子以為幸一以為幸一以為不幸則其是非榮辱不待别而可知矣故莭義者天下之大閑臣子之盛徳不蕩扵冨貴不蹙扵貧賤不揺扵威武道之􅀁在死生以之彼依阿淟涊枉已徇人者􅀁謂無関得喪徒缺雅道政使獲榮寵於一時迨夫勢移事易其前日之榮電滅風休漠無蹤跡其昭在人耳目者奸侫之名千古猶一日其為辱也庸有既乎嗚呼寧為此而死不為彼而生以是䖏心庶無愧於古人矣廟堂忠告臣張飬浩著脩身第一前軰謂仕䆠而至􅀅相為人情之􅀁榮是不知榮也者辱之基也惟善自脩者則􅀎保其榮不善自脩者適足速其辱􅀁謂善自􅁱者何㢘以律身忠以事上正以䖏事恭慎以率百僚如是則令名随焉輿論歸焉􅀑神福焉雖􅁒辭其榮不可得也􅀁謂不善自􅁱者何徇私􅁯公貪無紀極不戒覆車靡思報􅀦如是則惡名随焉衆毁歸焉􅀑神禍焉雖􅁒避其辱亦不可得也扵戯身為宰相何善不可行何㓛不可立顧廼為區區之利蠱惑而􅄭行豈不深可惜㢤且自古居相位者未聞死扵凍餓而􅂮扵財扵酒扵色扵逸樂者無代無之昔諸􅁑孔明為丞相二十年無尺寸之増扵家未甞憂其貧竟以勞扵王事而卒至今其名之榮甞若世享萬鍾而不絶者唐元載為相惟利是嗜及其敗也籍没其家胡􅎛八百斛其名之穢常若䝉不㓗而播臭無窮者嗚呼夫人以百年之身天假以年不過八十九十姑以八十為率計其得志不過三四十年而已豈有三四十年之閒􅀎食胡􅎛八百斛之理古人謂利令人智昬兹眀驗矣嗚呼凡為相者􅀎以諸􅁑孔眀為法唐之元載為戒雖台􅂦終身又何悔吝之有用賢第二天子之職莫重擇相宰相之職莫重用賢然則何以知其賢詢諸人則知之察其行則知之觀􅀁舉則知之夫為室而不衆工之資梓人雖巧室不􅀎成矣為􅀦家而不衆賢之集相臣雖才􅀦不治矣彼為相者誠􅀎開誠布公廓焉無我巳有不􅀎舉􅀎者而用之已有不知舉知者而用之已有不敢言舉敢言者而用之如是則彼之􅀁􅀎皆我有矣必欲一身而兼衆人之事雖大聖大賢有􅀁不􅀎夫粹白之狐舉世無􅀁有也然而有粹白之裘者善取扵衆而已矣况大臣初不貴乎事無不知第公正其心無􅀁􅎱疾則智者效謀勇者效力呫呫以為才捷捷以為辯自􅃷自伐則賢者必不樂為之用大拉人君自伐則臣軄有􅀁不行相臣自伐則百執事之軄有􅀁不行為人上者操約以馭繁居静以制動以無心而應天下之心則􅀁令者従􅀁庸者勸茍知其賢而任之既任而疑之而務勝之顧与不知不用自任其才也奚異若然則體統失而謟侫之小人至矣與小人䖏則天下之事不論可知吁重民第三盖聞古之王者授版則拜切意萬乗之尊為其民貶抑若是甞疑焉而不􅂑既而思之􅀦之􅀁以昌四夷之􅀁以靖朝廷之􅀁以隆宗廟社稷􅀁以血食悠久者㣲民不䏻爾也夫天以億兆之命託之君君以億兆之命託之相是知相也者為君乂民者也君也者為天為祖宗保民者也天以是託我祖宗以是託我敢不敬與敢不慎與􅸼受其託而不䏻使之遂生安業乃従而擾之虐之犬彘之草菅之則是􅊇天而違祖宗之命以自􅆷其􅀦也而可乎彼為民者固不敢与校然扵天之心扵祖宗之心其􅀎無􅀁戚欤甞謂愛民者無過扵天無過扵祖宗天生之難祖宗得之為尤難王者知其如是凛凛焉未甞不以民生為重聞其害則除之覩其利則舉之牧守非其人則易置之今夫鷹師圉人􅀁掌者不過人主服御之一物而人尚以内侍重之刺史縣令乃為祖宗為􅀦家牧飬斯民者反視為不切而漫􅂌之是愛民不如鷹犬重内侍不如受祖宗􅀦家一方生靈之􅀉者豈不顛倒失體㢤大拉下之􅀁以為惟上是視在上者誠有重民之心而天下不治者古今無有也逺慮第四天下之事知其已然不知其􅀅然者衆人也囙其已然而􅀅然未然􅊇而知之非深識逺慮者不䏻室已㷊而徙薪舟已溺而市壷疾已成而求艾雖殫力為之無及矣今夫隆然之堤有容蟻之穴宜若無􅀁損然周扵識者必塞而實之慮其乆而必底扵訌潰故也天下之事皆􅀎如是慮之尙何後患之有㢤大抵自古􅀦家之􅀁以不治臣子之􅀁以不􅁤固非一朝一夕之積良由今日以某事為小過而不諫明日以某人爲小罪而不懲日引月深不自知其禍亂之成也故臣之扵君獻可替否而不敢萌一毫姑息之心始以爲無傷卒至大可傷始以爲不足慮卒至深可慮惟君子爲􅀎見微知著思患而預防之扵飲宴則防流連扵田獵則防荒縦扵營繕則防踰制扵貨財則防損民扵爵賞則防僣及扵刑法則防濫殺扵君子則防踈逺扵小人則防玩狎扵聴覧則防容奸扵征伐則防瀆武夫君之扵臣亦有􅀁當逺慮者雖愛而不錫以過分之賞雖舊而不授以非㩀之官雖親而不交以亵瀆之談盖尊卑之分嚴則上下之體㝎上下之體㝎則禍亂無自而生天下之事可次第而治矣調燮第五人皆曰燮理隂陽為􅈗相事然舉世苐䏻道其辭迄不知隂陽何術可以燮理按書周官三公論道􅀴􅀖燮理隂陽盖周之三公即今􅈗輔而漢丞相平亦曰􅈗相上佐天子理隂陽順四時厥後又有灾異免三公之制世俗􅀁云盖本諸此切甞即是以思􅈗相􅀁以調燮者非􅀎旱焉而使之雨雨焉而使之􅊙要不越盡人事以来天地之和而已矣夫天之與人若判然而實相表裏盖政事順則民心順民心順則天地之氣順天地之氣順則隂陽漎而序矣若廼怙势立威挟權縦欲惡人異已謟侫是親扵􅀁言者不言扵􅀁救者不救上下相䝉惟務従命如此欲望民心順隂陽之氣和難矣大抵天道之災祥視民心之苦樂民心之苦樂視政事之失得政事之失得視􅈗相之賢与不賢昔丙吉舎死人問牛喘自以為淂體殊不知天道􅊇順當扵政事觀之固不在區區一牛之喘與否也晉􅁃冰為相􅂉謂天文錯度冝盡消禦之道冰曰玄象豈吾􅀁側正當勤盡人事冰之此言可謂蕳眀切要深得􅈗相之體者矣􅸼政事脩整雖隂陽之和不應乃天道之變也又何慊焉􅸼政事龎焉棼焉而不理雖禎祥集而風雨時若頋敢以為治乎嗚呼凡為相者誠􅀎以是求之則天人之理瞭然矣任怨第六夫為人臣惟􅁒収名而不敢任怨此不忠之尤者也居廟堂之上凡有􅀁為惟當揆之以義義茍不失悠悠之言奚恤㢤今夫两軍之交兵刃叢前而心誠報􅀦者尚冐之而不頋夫臨政之與臨敵其安危利害相距霄壤此猶頋惜抑不知扵萬􅂮一生之際為何如昔范文正公患諸路監司非人視選簿有不可者􅂺茟勾之􅂉謂一茟退一人則是一家哭矣公曰一家哭其如一路何嗚呼如是䖏心斯不負􅈗相之軄矣大抵天下之事有易有難有利有害難而有害者人多辭避利而易行者人多忻然以為殊不知官有長佐之分體有勞逸之殊長者逸而佐者勞此天地之大義也以朝廷言之君上逸而臣下勞以一家言之父母逸而子弟勞以一身言之頭目逸而手足勞嗚呼人而知此者必不􅔪君父以憂措其長扵衆怨之地矣近代為執政者往往姑息好名一疾言厲色不敢加扵人事􅂉犯衆激使居已之右者彂之嗚呼夫治家而使父母任其勞為􅀦家而使君長任其怨尚得為忠孝乎㢤况有罪不責有善不旌雖三代不􅀎為治故刑罰不患扵用直患乎用之而不公昔威公奪伯氏駢邑三百没齒而無怨言諸􅁑孔眀􅆸廖立而立聞亮死􅂺泣下為􅈗相誠􅀎公其心如是則天下蔑有不服者矣分􅉪第七夫共署聮事一人努力而前則餘者皆當輔相以成其志􅸼彼前我却彼行我止動焉而不相随語焉而不相應則事㓛之成者􅀎幾此古人􅀁以有推車同舟之喻也其􅂉共舟以濟而一人溺焉則凡在舟者無論䟽戚􅀁冝并力以救之此賢不肖之􅀁共知也况同為臣子同受天下􅀦家之寄者可㘴視一人被禍而不恤㢤使其爲一己之私自貽伊戚固無足恤其􅂉知無不言言無不盡公家之務一以大公至正䖏之彼非爲己爲家而得罪則凡同官者安淂不挺身而前与之共難也㢤大抵一人不幸而得罪爲長者若曰此我之罪爲貳者亦曰此我之罪使闔堂之人皆争引為已罪則彼􅀗罪者雖不􅀎釋亦必不至扵重論矣古之敢扵諌争者其遇不見聴納至謂與其殺此人不若殺臣尚為如此求解其肻㘴視同官􅁈抑而不省㢤嗚呼使分􅉪引咎之事為􅈗相者誠􅀎力行扵今􅀅見士大夫之名莭愈厲民間之薄俗可敦而􅀦家他日亦不患其無仗義死莭之士矣一事之行􅀁繫如此孰謂任怨分􅉪為􅈗相細行㢤應變苐八事機之彂有常有變常者中人䖏之而有餘變者雖上智亦有􅀁不足樽爼之下䘚然而報兵􅃍然而聞寇則當詳其虗實度其􅊇順殆不可一聞其言􅂺倉皇上變徵彂百出未見敵而先自撓也且事固有聲虗以釣實乗間以拘利􅀓微為巨以無形為有形疑似之間不可不察若夫􅀦有大奸境有大敵彼既非常而吾則以非常之計􅇱之若乃􅅺文守經終見動輙有礙而事亦無􅀁濟矣故古人遇此權以濟才随冝應變如丸轉扵盤而不出扵盤如水委曲赴海而不悖扵海王啇聞大水之言君臣皆驚而啇獨必其無事桓温􅀅移晉祚聲誅王謝而謝安雍容談咲以折其鋒囬紇􅄍蕃合兵涇陽郭子儀單􅀐以往喻盖􅈗相者非常之任也居非常之任獨不􅀎為非常之事可乎故前輩謂鎮㝎大事非至公血誠不􅀎􅂉死􅂉生舉置度外嗚呼世常以大臣􅀦家柱石者其謂茲與獻納第九人臣之納言扵君也事未然而言之則十従八九無事則游畋般樂日相親比一旦有􅀁不可乃左遮右挽極其力以救之殆未見其濟者政使􅂉允亦必出扵勉强而非其本心若夫善扵納言者則不然􅂉囙進見􅂉因講讀􅂉囙燕居先事陳􅀃如是則􅀦安如是則􅀦危如是則為聖君如是則為􅁀主􅂉引古昔􅂉援祖宗必使之心悟神㑹表裏􅋍然乃可陳善而無扞格之患昔孟子三見齊王而不言事曰我先攻其邪心大臣事君職當如此古人甚至有難扵自言者往往㫄召􅂄年宿徳置諸左右使人君有􅀁畏憚而不敢恣則其為慮亦深遠矣雖然臣之扵君也入則懇懇以盡忠出則謙謙以自悔凡􅀁白扵上者不可洩扵外而伐諸人善則歸君過則㱕已其若是者非􅁒逺嫌避旤大臣之體􅀁當然也坤之六二含章可貞盖亦此意甞見近代執政有􅀁建白呶呶焉惟恐人之不知䘚至䜛譛乗之中途見棄易大係􅀁謂君不宻則失臣臣不宻則失身諒㢤退休第十愽施兼善士君子通願也然有志而無才則不􅀎有才而無位則不􅀎有位而不見知扵上則不􅀎見知矣而小人間之則不􅀎嗚呼此士夫􅀁以出而用丗之難也上焉恥其君不及堯舜下焉思一夫不被其澤若已推而納諸溝中丗俗􅀁樂若聲色若宫室若􅎇異車服之奉一皆無有其􅀁有者自頂至踵天下􅀦家之憂而已為君上者誠􅀎亮其如是之懐凢有􅀁言優容喜納猶􅂉庶幾其􅂉疑其奪權違已賣直售名􅀅見舉動皆愆而身死無􅀁矣􅀁以自古忠直為􅀦者阿容侫詐惟已之為者多此無他盖由為已則有福而無旤為􅀦
