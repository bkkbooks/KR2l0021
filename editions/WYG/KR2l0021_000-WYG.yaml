body:
  text: 堂忠告而牧民忠告則為今時著也間嘗盡得而讀之廢書而歎曰是何忠厚之至哉因記弱冠時先子文靖府君語師泰曰我昔在朝當皇慶延祐間人物最盛一時相知固不少然求其志同道同者莫清河元復初濟南張希孟若也二人嘗聫鑣過我慷慨論議曰昃不忍舍去且相顧曰世豈復有相得如吾三人孰先死則後死者當銘諸使子孫世世無相忘也後三十年師泰承乏閩海憲使而公之子惟逺亦僉司事間語其故則相對悽愴不已遂請此書刻諸學宫以規夫牧民者嗚呼數年以来州郡多故黎民瘡痍每思一賢守令以安靖吾民而不可得乃知忠告之有補於世教也深矣使天下之為守今者家藏一書遵而行之雖單父武城之化不外是矣奚漢循吏之足論哉至正十五年秋九月乙巳後學宣城師泰序曩聞崇安令鄒從吉甫能以忠信使民民亦樂其治予過崇安㑹從吉問所治何先即出書一卷曰某不敏粗效一官者此書之力也予閲其書則濵國張文忠公為縣令時所著采比古人嘉言善行自正心修身以至事上恵下擿姦决疑䘏隠治賦凡可為郡縣楷式者無不曲盡其宜且簡而易行約而易守名之曰牧民忠告及余客京師嘗於臺臣之家見所謂風憲忠告者言風紀要務凡十章亦公為御史時所著也今年余謁閩海監憲莊公出風憲忠告將鋟梓以廣其傳俾令序之余得重觀是書則歎曰文忠真仁人也仁者恥獨善於己巳為令長得牧民之道欲使天下牧民之吏人人盡其道已為憲臣能振紀綱慎舉刺言人所難言欲使天下為憲臣者人人皆然公其心於天下而不私其身雖令尹子文之忠不及此也傳曰仁人之言其利溥哉是書可謂仁人之言矣時文忠公之子引来僉閩憲克濟世徳云至正乙未秋林泉生序士君子之生斯世也力學以行其道立言以明其道故雖沒猶不沒也吾鄉雲莊張先生希孟元之名臣也道徳文章著聞當時顥生也晚不獲親炙先生之門嘗侍先君子聞先生有牧民忠告風憲忠告廟堂忠告等書而不一見又聞先生為西臺中丞時憫民饑死作詩白於朝有曰西風疋馬過長安饑殍盈途不忍看十里路埋千百冢一家人哭兩三般犬銜枯骨筋猶在鴉啄新屍血未乾寄語廟堂賢宰相鐵人聞此也心酸即發粟賑貸民頼以活者不可勝數先生之竒功碩徳類蓋如此今年夏予以公務過髙州謁先聖廟儒學教授髙某知予齊人因出先生所著廟堂忠告諸編予得盡讀之則昔之不慊於心者釋然矣嗟夫公之用心仁矣哉不惟有以善諸已又欲有以淑諸人夫仁心仁政無古今前後之殊但聖人先得我心之所同然爾茍得其所同然雖越千百載猶一日也嗟夫事君之要為政之方具在此書豈敢獨私是用命工鋟梓傳諸四方與同志共之洪武二十三年庚午六月朔廣東等處承宣布政使司左參議靳顥序欽定四庫全書三事忠告卷一元張飬浩撰
