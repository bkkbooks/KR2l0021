front:
  text: 牧民忠告上
  hash: sha256:586e6ce95811b3c5d3b3cee140505827f4dbc95925ce36a53af7a19901a29b13
body:
  text: 拜命第一省已命下之日則拊心自省有何勲閥行能膺兹異數茍要其廪禄假其威權惟濟巳私靡思報國天監伊邇將不汝容夫受人直而怠其工儋人爵而曠其事已則逸矣如公道何如百姓何克性之偏夫及物之心人孰不有第材質强劣有所不同茍即其所短而痛自克治則官無難為事無不集者矣弛緩克之以敏浮薄克之以莊率畧克之以詳煩苛克之以大體苟不度所任一循己之偏而處之鮮有不敗者矣古人佩弦佩韋亦皆此意今人徃徃讀書無益涖官不才者皆由狃於習而不知痛自克治故也戒貪普天率土生人無窮也然受國寵靈而為民司牧者能幾何人既受命以牧斯民矣而不能守公亷之心是不自愛也寧不為世所誚耶况一身之㣲所享能幾厥心谿壑適以自賊一或罪及上孤國恩中貽親辱下使郷隣朋友䝉詬包羞雖任累千金不足以償一夕縲紲之苦與其戚於已敗曷若嚴於未然嗟爾有官所宜深戒民職不宜泛授今選官者大率重内而輕外殊不知漢宣帝所以富民唐太宗所以家給人足皆由重牧民之長故也嗚呼牧民之長其重若此乃泛焉而選懵焉而授奚為不是慮也哉心誠愛民智無不及赤子之生無有知識然母之者常先意得其所欲焉其理無他誠然而已矣誠生愛愛生智惟其誠故愛無不周惟其愛故智無不及吏之於民與是奚異哉誠有子民之心則不患其才智之不及矣法律為師吏人蓋以法律為師也魏相所以望隆當世者漢家典故無所不悉也凡學仕者經史之餘若國朝以来典章文物亦須備考詳觀一旦入官庶不為俗吏所迂也上任第二事不預知難以應卒比入其境民瘼輕重吏弊深淺前官良否强宗有無控訴之人多與寡皆須盡心詢訪也至則逺居數舎召掌之者語其詳疏其槩先得其情下車之日參考以斷若素無所備率然至部聽訟之際百姓聚觀一語乖張則必貽笑闔境况民心易動尤在厥初初焉無以厭服其心後雖有為亦將奚信不然受其訟而翼日理之亦可殆不宜輕率應荅使士民失望也受謁諸執事參謁不可黙然無一言第曰誤䝉國恩託兹重寄芒背汗顔期與諸君滌慮洗心以宣大化也汝或余違國有常憲非所敢私諸君其慎之治官如治家治官如治家古人常有是訓矣蓋一家之事無緩急巨細皆所當知有所不知則有所不治也况牧民之長百責所叢若庠序若傳置若倉廥若囹圄若溝洫若橋障凡所司者甚衆也相時度力敝者葺之汙者潔之堙者疏之缺者補之舊所無有者經營之若曰彼之不修何預我事瞬息代去自苦奚為此念一萌則庶務皆隳矣前輩謂公家之務一毫不盡其心即為苟禄獲罪於天瘴説昔人有欲之官而惡其地之瘴者或釋之曰瘴之為害不特地也仕亦有瘴也急催暴斂剥下奉上此租賦之瘴深文以逞良惡不白此刑獄之瘴侵牟民利以實私儲此貨財之瘴攻金攻木崇飾車服此工役之瘴盛揀姬妾以娱聲色此帷薄之瘴也有一於此無間逺邇民怨神怒無疾者必有疾而有疾者必死也昔元城劉先生處瘴海而神觀愈强是知地之瘴者未必能死人而能死人者常在乎仕瘴也慮彼而不慮此不亦左乎故余具載其言以為授官憚逺避難者之戒禁家人侵漁居官所以不能清白者率由家人喜奢好侈使然也中既不給其勢必當取於人或營利以侵民或因訟而納賄或名假貸或託姻屬宴饋徴逐通室無禁以致動相掣肘威無所施已雖日昌民則日瘁已雖日歡民則日怨由是而坐敗辱者蓋駢首纚踵也嗚呼使為妻妾而為之則妻妾不能我救也使為子孫而為之則子孫不能我救也使為朋友而為之則朋友不能我救也妻妾子孫朋友皆不能我救也曷若亷勤乃職而自為之為愈也哉蓋自為雖闔門恒淡泊而安榮及子孫為人雖讙然如可樂而禍患生几席也二者之間非真知深悟者未易與言有官君子其審擇焉告廟故事牧民官既上必告境内所當祀之神宜以不賄自為誓庶堅其遷善之心焉爾後雖欲轉移亦必有所畏而不敢聽訟第三察情人不能獨處必資衆以遂其生衆以相資此訟之所從起也故聖人作易訟繼以師其示警固深矣夫善聼訟者必先察其情欲察其情必先審其辭其情直其辭直其情曲其辭曲正使强直其辭而其情則必自相矛盾從而詰之誠偽見矣周禮以五聲聽獄訟求民情固不外乎此然聖人謂聽訟吾猶人也必也使無訟乎蓋聽訟者折衷於已然茍公其心人皆可能也無訟者救過於未然非以徳化民何由及此嗚呼凡牧民者其勿恃能聽訟為得也弭訟起訟有原書訟牒者是也蓋蚩蚩之氓闇於刑憲書訟者誠能開之以枉直而曉之以利害鮮有不愧服兩釋而退者惟其心利於所獲含糊其是非陽解而隂嗾左縱而右擒舞智㺯民不厭不已所以厥今吏案情偽混殽莫之能信者蓋職乎此也大抵一方之訟宜擇一二老成鍊事者使書之月比而季考酌其功過而加賞罰焉若夫毆詈假質凡不切之訟聽其從宜諭遣之諭之而不伏乃達於官終無悛心律以三尺如此則訟源可清而民間澆薄之俗庶幾乎復歸於厚矣勿聽讒健訟者理或不勝則徃徃誣其敵嘗謗官長也聽之者當平心易氣置謗言於事外惟覈其實而遣之庶不墮奸民計中矣親族之訟宜緩親族相訟宜徐而不宜亟宜寛而不宜猛徐則或悟其非猛則益滋其惡第下其里中開諭之斯得體矣别强弱世俗之情强者欺弱富者吞貧衆者暴寡在官者多凌無勢之人聽訟之際不可不察待問者勿停留昔嘗使外所過州縣待問者雲集乎門每病焉乃命一能吏簿其所告而日省之而日遣之不浹旬則訟庭閴然矣㑹問訟有相約而問者不可乘一時之忿擅加榜掠也若釋道若兵卒諸不隸所部者是已妖言民有妖言惑衆者則當假以别罪而罪之如有妄書取而火之則厥跡滅矣勿使蔓為大獄延禍無辜民病如已病民之有訟如已有訟民之流亡如已流亡民在縲紲如已在縲紲民陷水火如已陷水火凡民疾苦皆如已疾苦也雖欲因仍可得乎移聽近年司憲受詞訟徃徃檄州郡官代聽之代聽者不可承望風㫖邀寵一時使人茹枉受刑而靡恤隂理御下第四御吏吏佐官治事其人不可缺而其勢最親惟其親故久而必至無所畏惟其不可缺故久而必至為姦此當今之通病也欲其有所畏則莫若自嚴欲其不為姦則莫若詳視其案也所謂自嚴者非厲聲色也絶其饋遺而已矣所謂詳視其案者非吹毛求疵也理其綱領而已矣蓋天下之事無有巨細皆資案牘以行焉少不經心則姦偽隨出大抵使不忍欺為上不能欺次之不敢欺又次之夫以善感人者非聖人不能故前輩謂不忍欺在徳不能欺在明不敢欺在威於斯三者度已所能而處之庶不為彼所侮矣約束諸吏曹勿使縱游民間納交富室以泄官事以来訟端以啓倖門也暇則召集講經讀律多方羈縻之則自然不横矣待徒隸皂卒徒隸非公故勿與語非公遣勿使與民相徃来若輩小人威以涖之猶恐為患一或解嚴必百無忌憚矣省事為治之道其要莫如省心心省則事省事省則民安民安則吏無所資一或紛然上下胥罹其擾也然事亦有必不能省者則又在夫措畫隄防之術何如耳古人謂多筭勝少算少算勝無算不特用兵為然一役之修一宴之設一獄之興誠能思慮周詳繁略畢舉則民之受賜不淺矣某嘗為縣胥吏輩春則追農以報農桑夏則檄尉以練卒伍秋則㑹社以檢義糧冬則賦芻以飼尚馬其他若逃兵亡户逸盗及積年逋税之民動集百餘不賄不釋某見其然常揮牘不為署暇則將一二謹厚吏親詣其地而按之可擬者擬可行者行由是一切惟以信版集事吏人失志百姓獲安至今旁郡以為例威嚴小而為一邑大而為天下賞罰明則不煩聲色而威令自行人徒知治民之難而不知治吏為尤難蓋民與官不能知理法誤然而犯宜若可矜吏則日處法律中非不知也小過不懲必為大患無所忌憚矣嘗聞治民如治目撥觸之則益昏治吏如治齒牙剔潄則益利傳曰威克厥愛允濟愛克厥威允罔功法此而行斷不至於難治矣先勞古之為政者身任其勞而貽百姓以安今之為政者身享其安而貽百姓以勞已勞則民逸已逸則民勞此必然之理也憚一已之勞而使闔境之民不靖仁人君子其忍爾乎昔子路問政而聖人告以先之勞之無倦嗚呼此真萬世為政之格言也歟申舊制朝廷徳澤牧民者多屯而不能宣布所謂文武之道布在方策但有司寢廢而不為申明遂為墜典苟求揭而行之則不待他而治道備矣明綱常欲先教化去其斁教悖化者則善類興矣近年子叛其父妻離其夫婦姑勃蹊昆弟侮間奴不受主命冠屨倒置者比比皆然凡若此者不必其来告當風鄉長恒糾其尤甚者諭衆而嚴决之則自􅋏然改行矣勉學學校乃風化之本俗吏多忽焉不以為務是不知天秩民彜一切治道胥此焉出暇則率僚宷以觀講習或生徒有未濟廩餼有未充祭物有未完教養有未至激勸有未周皆敦篤以成之久則弦誦之聲作而禮義之俗可興矣勸農農之勤惰一嵗之苦樂係焉其所當為有不待勸焉者時因行治視其輟工廢業者切責之逺近聞之必知自勵也常見世之勸農者先期以告鳩酒食候郊原將迎奔走絡繹無寧蓋數日騷然也至則胥吏童卒襍然而生威賂遺徴取下及雞豚名為勸之其實擾之名為優之其實勞之嗟夫勸農之道無他也勿奪其時而已矣繁文末節當為略之服逺或問逺方獠民巢居溪洞猛不能讋寛不能懐喜則人怒則獸欲宣朝廷徳澤若之何而可余曰物之至狠無虎狼若也然使之左右前後惟吾之聽者得乎制之之術也夫克剛莫若柔治繁莫如簡且逺之所以反側不恒者亦必有由矣或貪其財或喜其滅或俘其子女或戮其官屬以致蟻結蜂屯肆其酷毒將安之而不能誅之而非所事兹欲翕然鼔舞而聽吾之節制但嚴守已界恬不與較久而彼自馴伏矣况彼兵一動守土者非有上命坐視而不敢前比許追襲則已雉兔逃而禽鳥㪚矣由是而論安靜不競者為上恬無所求者次之邀功生事妄開邊釁斯為下矣官於逺方者尚監於兹恤鰥寡鰥寡孤獨王政所先聖人所深憫其聚居之所暇則親涖之或遣人省視若衣糧若藥餌吏不時給者糾治之戢强或謂民有豪强則不能致治是殆為貪邪之吏而發也夫豪强之所以敢横者由牧民者有以縱之也何也與之交私故也茍絶其私不動聲色而使其膽落語曰其身正不令而行又曰不怒而民威於鈇鉞信哉示勸諸民有旌表及學行異衆者時加存慰為勸必多毁淫祠毁淫祠非燭理明而信道篤者不能非行已端而處心正者不敢三事忠告卷一欽定四庫全書三事忠告卷二元張養浩撰牧民忠告下慎獄第六存恕人之良孰願為盗也由長民者失於教養凍餒之極遂至於此要非其得已也嘗潛體其然使父饑母寒妻子愠見徴負旁午疹疫交攻萬死一生朝不逮暮於斯時也見利而不囘者能幾何人其或因而攘竊不原其情輙置諸理嬰笞闗木彼固無辭然百需叢身孰明其不獲已哉古人謂上失其道民散久矣如得其情則哀矜而勿喜嗚呼人能以是論囚雖欲慘酷亦必有所不忍矣獄詰其初獄問初情人之常言也蓋獄之初發犯者不暇藻飾問者不暇鍛錬其情必真而易見威以臨之虚心以詰之十得七八矣少萌姑息則其勞將有百倍厥初者故片言折獄聖人惟與乎子路其難可知矣詳讞在獄之囚吏案雖成猶當詳讞也若酷吏鍛鍊而成者雖讞之囚不敢異辭焉須盡辟吏卒和顔易氣開誠心以感之或令忠厚獄卒欵曲以其情問之如得其寃立為辨白不可徒拘閡吏文也噫姦吏舞文何所不至哉視屍故事承檢屍之牒則劃時而行重人命也其或行焉而後時時焉而不親涖親焉而不精詳罪皆不輕也其檢之之式又當徧考筮仕者不可以不知囚糧天地之徳曰好生聖朝體之以有天下諸在縲紲無家者皆給之糧惟縣獄不給也意者縣非待報之官府故令略詰其然而上之州比見為州者徃徃為吏之所欺吹求不受以致瘐死於縣獄夫罪不至死而以已私繆殺之不仁甚矣為州若府者尙深戒之巡警詰盗非難而警盗為難警盜非難而使民不為盜尤難蓋天下之事先其幾為之則有餘後其幾為之則艱苦而無益夫盗之發也恒出不虞知者防於未然其防之之術則在廣耳目嚴巡邏戒飲博禁游聚或旬或月即命尉行境以恐懼之夫盗猶鼠也尉猶捕鼠之貍也勤於出鼠必伏而不動貍怠出則鼠必興矣彼為尉者與其勞於已然孰若警於未發之為愈若夫使民不為盗則又在於勤本以致富勤斯富富斯禮義生禮義生雖驅之使竊亦必不肯為之矣故管子謂倉廪實而知禮節衣食足而知榮辱諒哉按視獄庭時當一至也不惟有以安衆囚之心亦使司獄卒吏輩知所警畏而無飲博喧嘩逸而反獄者是亦先事防之之㣲意也倉庫同哀矜亾友段伯英嘗尹鉅野民有犯法受刑者每為泣下或以為過余聞之私自語曰人必有是心然後可以語王政且獨不聞古人亦有禁人於獄而不家寢者乎要皆良心之所發非過也非縱囚古人縱囚省親如期還獄者甚多要不可以為法也夫法者天子之所有而民或犯之是犯天子之法也而彼乃與期而縱之是不幾於㺯天子之法以掠美市恩於下者乎然出於朝廷則可出於一已之私則不可自責教民不至則犯禁者多養民無術則病饑者衆為守與牧而使其至此獨歸咎於民難矣哉救荒第七捕蝗故事蝗生境内必馳聞於上少淹頃刻所坐不輕然長民者亦須相其小大多寡為害輕重若遽然以聞涖其上者羣集族赴供張徴索一境騷然其害反甚於蝗者其或勢㣲種穉則當亟率衆力以圖之不必因細虞以来大難於民也故凡居官必先敢於負荷而後可以有為多方救賑天所畀人富與貴者非欲其自裕蓋將使推所有以濟人之不及也饑者食之寒者衣之斯不負天畀之富矣直者舉之枉者錯之斯不負天畀之貴矣然富貴而能若是者其恵在人而善則在已名為恵人實自恵也故古之有民社者或不幸而值㐫荒夭扎之變視其輕重必有術以處之或私帑之分或公廪之發或託之工役或假以山澤或已負蠲征募糴勸糶或聽民收其遺稚或命醫療其疹疾凡可以拯其生者靡㣲不至蓋古人視民如子天下未有子在難而父母坐視不救之理也嗚呼凡牧民者其以古之人為法庶無彼我之間哉預備災異之生常出於人之所不意誠素有其備雖甚災不足為憂也今州郡多無委積雖有之而在上者封錮甚嚴不測有虞茫無所措手此厥今牧民者之通患也然今所謂祗應之錢者山州僻縣未嘗有之而使客徃還率無枵腹而過者意必有以規畫也至於備荒之儲獨未有及焉者豈以治平之時何遽有此所以因仍嵗月幸滿而去不復為民逺慮耶嘗聞近代為縣者教民種蔓菁摀其根以為餅大者三四斤乾而儲之後值㐫年蒸以食饑民味甘且美賴以全活者甚衆夫古人慮民之周也如此其肯苟且幸代而不為民預備㦲均賦故事民之税賦三年則第其貧富而均平之或好名未及而先為或避謗踰期而不為皆非也如期行之民受賜不淺矣祈禱凡有祈禱不必勞衆齋居三日以思已愆民有寃歟已有贓歟政事有未善歟報國之心有未誠歟無則如儀行事有則必俟追改而後禱焉夫動天地感鬼神非至誠不可纎毫之惡未除則彼此邈然矣不可奴妾流民嘗見一顯官於凶年市所部民子女殆數十餘人美且壯者皆奴妾之餘將賂時要以希恩寵也僕聞而顰蹙曰使其困憊吾治已得罪矣又不能救而反奴妾之不大獲罪於法耶故感而書之以戒後來者救焚民或失火則伐皷集衆親涖以救之惻隠之心人所共有誠能皷舞以作其氣雖仇人亦將焦頭爛額而相趨患難矣尙徳反風㓕火虎渡河蝗不入境金境之水囘流此在長民者之徳何如耳殆不可皆謂之偶然也上災異災異之事則不可不聞祥瑞雖不上可也事長第八各守涯分尊卑之分定則家無逆子國無叛臣夫國之所以亾家之所以敗皆由卑不有尊而尊不能制卑之所致也考諸歴代厥監甚明今夫上而朝廷下而郡邑其設官也有長焉有貳焉有幕屬焉有胥吏焉各安其分而事其事天下安有不治者哉惟其小智自私乖同寅之義無協恭之誠衷既不和則所見必有不同者以長官不知待佐貳之禮也或佐貳闇於事長官之道也少見辭色則彼此胥失矣若夫事例應爾而所見或不同居下者當誠其意婉其辭卑其容體以開其上若猶未允則俟其退而語之家人非木石無不囘之理其或居下者有所不可為長者亦當如是曉之也稍有所挾雖面强從退而必有不堪者日引月深終於洩露人見其乖忤也讒譖之言乘之而入入則訟必興而政事隳矣為一時之忿使同僚之心離闔境之民不得治則其人之褊淺可知矣古人有言必有忍乃其有濟又曰欲成大事必須少忍又曰忍為衆妙之門㫖哉寧人負我寧人負我無我負人此待已之道也天下之善不必已出此待人之道也能行斯二者於道其庶幾乎處患難凡在官者當知榮與辱相倚伏得與失相勝負成與敗相循環古今未有榮而無辱得而無失成而無敗之理也雖天地之運隂陽之化物理人事莫不皆然處之不以道則纎毫之寵必揺而一唾之辱必挫矣故君子於外物輕重皆所不恤顧其在我者何如爾使其有可辱雖不加譴而君子恒以為不足使其無可辱雖置之死地而君子恒以為有餘歴觀自昔大聖大賢不幸横罹禍患恬然不易其素者灼乎此而已矣茍惟能處榮而不能處辱惟能安順境而逆境則不能一朝居欲望其臨政有餘為難矣嗚呼善觀人者其於此焉察之分謗是非毁譽自古為政所不能無者是則歸人非則歸已聞譽則歸人聞毁則歸已無長無貳處之皆當如是也前輩云恩欲已出怨將誰歸嗚呼此真博大君子之言也以禮下人夫能下人者其志必髙其所至必逺昔某郡有新守褊驁大不禮其下常令掾屬羅拜於庭下有一賢掾初以疾在告疾愈當庭參是日偶大雨守命張傘布茅於庭下使掾拜焉掾恬然不動容興伏惟謹識者知其他日必為宰相也後果然不可以律已之律律人同官有過不至害政宜為包容大抵律已當嚴待人當恕必欲人人同已天下必無是理也受代第九郊迎新代聞代者来則避所居而郊迎之不可以其代已也而疾之而薄之而不以舊政告之也大抵天下之善在彼猶在此勸人為善即已之為善也詎可惟許已為善而不願他人為善哉克終為政者不難於始而難於克終也初焉則鋭中焉則緩末焉則廢者人之情也慎終如始故君子稱焉不競當見世之交代者多有所爭要皆舊官不廣之所致或據其居而不徙或専其田而不分或匿其公物不盡以相授使新者懐不平而無所訴甚非士君子善後之道也夫利之與義勢不並處義親則利䟽利近則義逺况為民師帥而専務於利其聚怨納侮視市井小人不若也故君子之從政也寧公而貧不私而富寜讓而損已不競而損人不可自鬻代之未至也風民立石以頌徳結綺門以祖行鳩錢帛以佐路費建生祠以圖不朽之名皆非士君子之事也蓋為善不求人知者為上知而不自有其善者次之呶呶焉自媒自鬻惟崇虚譽者風斯在下矣告以舊政近代東原吴曼慶為某所憲長既代諄諄告上者曰某事有少許未完某獄已具而未决某案有如是可疑某人有許能而可用一部之政毫分縷析惟恐其不知知之惟恐其不盡嗚呼今之仕者方其在職尚不肯用心况已代去而敢責其如是哉完歸其在政也民被徳澤訟清盗息豪强消沮同僚悦服則去之之日雖敝車羸馬行橐蕭然其樂有不翅萬金獲而千駟受者前輩由外官而至執政者論濟人之功皆自以為不及為縣逺甚嗚呼有志及物者其勿薄州縣而不屑為也閒居第十輕去就士之仕也有其任斯有其責有其責斯有其憂任一縣之責者則憂一縣任一州之責者則憂一州任一路之責天下之責者則一路與天下為憂也蓋任重則責重責重則憂深古之人所以三揖而進一揖而退者有以也雖堯舜禹湯文武之為君臯䕫稷契伊傅周召之為臣固未嘗不憂其責而以位為樂也彼以位為樂者苟其位者也嗚呼大聖大賢宜不難於其所任猶且不自暇逸如此吾才逺不逮聖賢顧可樂其位而重其去也哉致政古人以休官致政為釋重負而脱羈囚竊嘗思之誠有是理方其仕也嚴出入而慎起居一嚬一笑亦不敢以輕假人蓋一身而為衆師表少踰規矩謗議四聞譬之特行於高屋之上自頂至踵在下者無不見之也一朝代至完身而去詎止如釋重負脱羈囚而已哉嘗見仕而休居者徃徃不喜或命子姪或託朋友市奸搆訟靡政不及小有所違則曰去官同見任使新上者法格令弛拒納難容而撓沮排觝為狀百端細民無知亦從而靡設使已政之初人以是薦擾當若何推心體之必自知其可惡矣進退皆有為進則安居以行其志退則安居以修其所未能則是進亦有為退亦有為也近世士大夫惟狃於進退則惛然無所猷為甚而茹愧懐慙蹙縮不敢一出户夫軒冕古人以為儻来之物也其有也何所加其無也何所損不思良貴在我惟假於物以為重輕焉則其人品之卑下不待論而可知矣以義處命世俗以窮達進退皆本夫命謂命之窮者雖竭蹶求進而亦窮命之達者雖逺逝深藏而亦不能退此星翁術士之常談非君子所尚也君子則以義處命而不以命害義可以進則進可以退則退吾不謂命也樂則行之憂則違之吾豈謂命哉彼淪胥富貴利達之境而不能出者則徃徃託命以自誣宜乎接武禍機而卒不能悟悲夫求進於已士當求進於已而不可求進於人也所謂求進於已者道業學術之精是已所謂求進於人者富貴利達之榮是已蓋富貴利達在天而不可求道業學術在我而不可不求也况古之人不以富貴利逹為心也其所以從仕者宜假此以行道也道不行而富貴利達者古人以為恥而不以為榮嗚呼非誠有致君澤民之心者其孰能與於此風節名節之於人不金幣而富不軒冕而貴士無名節猶女不貞則何暴不從何美不附雖有他美亦不足贖也故前輩謂爵禄易得名節難保爵禄或失有時而再来名節一虧終身不復矣嗚呼士而居閒者能以此言銘其心庶不易所守而趨勢要哉三事忠告卷二欽定四庫全書三事忠告卷三元張養浩撰元張養浩撰牧民忠告下慎獄第六存恕人之良孰願為盗也由長民者失於教養凍餒之極遂至於此要非其得已也嘗潛體其然使父饑母寒妻子愠見徴負旁午疹疫交攻萬死一生朝不逮暮於斯時也見利而不囘者能幾何人其或因而攘竊不原其情輙置諸理嬰笞闗木彼固無辭然百需叢身孰明其不獲已哉古人謂上失其道民散久矣如得其情則哀矜而勿喜嗚呼人能以是論囚雖欲慘酷亦必有所不忍矣獄詰其初獄問初情人之常言也蓋獄之初發犯者不暇藻飾問者不暇鍛錬其情必真而易見威以臨之虚心以詰之十得七八矣少萌姑息則其勞將有百倍厥初者故片言折獄聖人惟與乎子路其難可知矣詳讞在獄之囚吏案雖成猶當詳讞也若酷吏鍛鍊而成者雖讞之囚不敢異辭焉須盡辟吏卒和顔易氣開誠心以感之或令忠厚獄卒欵曲以其情問之如得其寃立為辨白不可徒拘閡吏文也噫姦吏舞文何所不至哉視屍故事承檢屍之牒則劃時而行重人命也其或行焉而後時時焉而不親涖親焉而不精詳罪皆不輕也其檢之之式又當徧考筮仕者不可以不知囚糧天地之徳曰好生聖朝體之以有天下諸在縲紲無家者皆給之糧惟縣獄不給也意者縣非待報之官府故令略詰其然而上之州比見為州者徃徃為吏之所欺吹求不受以致瘐死於縣獄夫罪不至死而以已私繆殺之不仁甚矣為州若府者尙深戒之巡警詰盗非難而警盗為難警盜非難而使民不為盜尤難蓋天下之事先其幾為之則有餘後其幾為之則艱苦而無益夫盗之發也恒出不虞知者防於未然其防之之術則在廣耳目嚴巡邏戒飲博禁游聚或旬或月即命尉行境以恐懼之夫盗猶鼠也尉猶捕鼠之貍也勤於出鼠必伏而不動貍怠出則鼠必興矣彼為尉者與其勞於已然孰若警於未發之為愈若夫使民不為盗則又在於勤本以致富勤斯富富斯禮義生禮義生雖驅之使竊亦必不肯為之矣故管子謂倉廪實而知禮節衣食足而知榮辱諒哉按視獄庭時當一至也不惟有以安衆囚之心亦使司獄卒吏輩知所警畏而無飲博喧嘩逸而反獄者是亦先事防之之㣲意也倉庫同哀矜亾友段伯英嘗尹鉅野民有犯法受刑者每為泣下或以為過余聞之私自語曰人必有是心然後可以語王政且獨不聞古人亦有禁人於獄而不家寢者乎要皆良心之所發非過也非縱囚古人縱囚省親如期還獄者甚多要不可以為法也夫法者天子之所有而民或犯之是犯天子之法也而彼乃與期而縱之是不幾於㺯天子之法以掠美市恩於下者乎然出於朝廷則可出於一已之私則不可自責教民不至則犯禁者多養民無術則病饑者衆為守與牧而使其至此獨歸咎於民難矣哉救荒第七捕蝗故事蝗生境内必馳聞於上少淹頃刻所坐不輕然長民者亦須相其小大多寡為害輕重若遽然以聞涖其上者羣集族赴供張徴索一境騷然其害反甚於蝗者其或勢㣲種穉則當亟率衆力以圖之不必因細虞以来大難於民也故凡居官必先敢於負荷而後可以有為多方救賑天所畀人富與貴者非欲其自裕蓋將使推所有以濟人之不及也饑者食之寒者衣之斯不負天畀之富矣直者舉之枉者錯之斯不負天畀之貴矣然富貴而能若是者其恵在人而善則在已名為恵人實自恵也故古之有民社者或不幸而值㐫荒夭扎之變視其輕重必有術以處之或私帑之分或公廪之發或託之工役或假以山澤或已負蠲征募糴勸糶或聽民收其遺稚或命醫療其疹疾凡可以拯其生者靡㣲不至蓋古人視民如子天下未有子在難而父母坐視不救之理也嗚呼凡牧民者其以古之人為法庶無彼我之間哉預備災異之生常出於人之所不意誠素有其備雖甚災不足為憂也今州郡多無委積雖有之而在上者封錮甚嚴不測有虞茫無所措手此厥今牧民者之通患也然今所謂祗應之錢者山州僻縣未嘗有之而使客徃還率無枵腹而過者意必有以規畫也至於備荒之儲獨未有及焉者豈以治平之時何遽有此所以因仍嵗月幸滿而去不復為民逺慮耶嘗聞近代為縣者教民種蔓菁摀其根以為餅大者三四斤乾而儲之後值㐫年蒸以食饑民味甘且美賴以全活者甚衆夫古人慮民之周也如此其肯苟且幸代而不為民預備㦲均賦故事民之税賦三年則第其貧富而均平之或好名未及而先為或避謗踰期而不為皆非也如期行之民受賜不淺矣祈禱凡有祈禱不必勞衆齋居三日以思已愆民有寃歟已有贓歟政事有未善歟報國之心有未誠歟無則如儀行事有則必俟追改而後禱焉夫動天地感鬼神非至誠不可纎毫之惡未除則彼此邈然矣不可奴妾流民嘗見一顯官於凶年市所部民子女殆數十餘人美且壯者皆奴妾之餘將賂時要以希恩寵也僕聞而顰蹙曰使其困憊吾治已得罪矣又不能救而反奴妾之不大獲罪於法耶故感而書之以戒後來者救焚民或失火則伐皷集衆親涖以救之惻隠之心人所共有誠能皷舞以作其氣雖仇人亦將焦頭爛額而相趨患難矣尙徳反風㓕火虎渡河蝗不入境金境之水囘流此在長民者之徳何如耳殆不可皆謂之偶然也上災異災異之事則不可不聞祥瑞雖不上可也事長第八各守涯分尊卑之分定則家無逆子國無叛臣夫國之所以亾家之所以敗皆由卑不有尊而尊不能制卑之所致也考諸歴代厥監甚明今夫上而朝廷下而郡邑其設官也有長焉有貳焉有幕屬焉有胥吏焉各安其分而事其事天下安有不治者哉惟其小智自私乖同寅之義無協恭之誠衷既不和則所見必有不同者以長官不知待佐貳之禮也或佐貳闇於事長官之道也少見辭色則彼此胥失矣若夫事例應爾而所見或不同居下者當誠其意婉其辭卑其容體以開其上若猶未允則俟其退而語之家人非木石無不囘之理其或居下者有所不可為長者亦當如是曉之也稍有所挾雖面强從退而必有不堪者日引月深終於洩露人見其乖忤也讒譖之言乘之而入入則訟必興而政事隳矣為一時之忿使同僚之心離闔境之民不得治則其人之褊淺可知矣古人有言必有忍乃其有濟又曰欲成大事必須少忍又曰忍為衆妙之門㫖哉寧人負我寧人負我無我負人此待已之道也天下之善不必已出此待人之道也能行斯二者於道其庶幾乎處患難凡在官者當知榮與辱相倚伏得與失相勝負成與敗相循環古今未有榮而無辱得而無失成而無敗之理也雖天地之運隂陽之化物理人事莫不皆然處之不以道則纎毫之寵必揺而一唾之辱必挫矣故君子於外物輕重皆所不恤顧其在我者何如爾使其有可辱雖不加譴而君子恒以為不足使其無可辱雖置之死地而君子恒以為有餘歴觀自昔大聖大賢不幸横罹禍患恬然不易其素者灼乎此而已矣茍惟能處榮而不能處辱惟能安順境而逆境則不能一朝居欲望其臨政有餘為難矣嗚呼善觀人者其於此焉察之分謗是非毁譽自古為政所不能無者是則歸人非則歸已聞譽則歸人聞毁則歸已無長無貳處之皆當如是也前輩云恩欲已出怨將誰歸嗚呼此真博大君子之言也以禮下人夫能下人者其志必髙其所至必逺昔某郡有新守褊驁大不禮其下常令掾屬羅拜於庭下有一賢掾初以疾在告疾愈當庭參是日偶大雨守命張傘布茅於庭下使掾拜焉掾恬然不動容興伏惟謹識者知其他日必為宰相也後果然不可以律已之律律人同官有過不至害政宜為包容大抵律已當嚴待人當恕必欲人人同已天下必無是理也受代第九郊迎新代聞代者来則避所居而郊迎之不可以其代已也而疾之而薄之而不以舊政告之也大抵天下之善在彼猶在此勸人為善即已之為善也詎可惟許已為善而不願他人為善哉克終為政者不難於始而難於克終也初焉則鋭中焉則緩末焉則廢者人之情也慎終如始故君子稱焉不競當見世之交代者多有所爭要皆舊官不廣之所致或據其居而不徙或専其田而不分或匿其公物不盡以相授使新者懐不平而無所訴甚非士君子善後之道也夫利之與義勢不並處義親則利䟽利近則義逺况為民師帥而専務於利其聚怨納侮視市井小人不若也故君子之從政也寧公而貧不私而富寜讓而損已不競而損人不可自鬻代之未至也風民立石以頌徳結綺門以祖行鳩錢帛以佐路費建生祠以圖不朽之名皆非士君子之事也蓋為善不求人知者為上知而不自有其善者次之呶呶焉自媒自鬻惟崇虚譽者風斯在下矣告以舊政近代東原吴曼慶為某所憲長既代諄諄告上者曰某事有少許未完某獄已具而未决某案有如是可疑某人有許能而可用一部之政毫分縷析惟恐其不知知之惟恐其不盡嗚呼今之仕者方其在職尚不肯用心况已代去而敢責其如是哉完歸其在政也民被徳澤訟清盗息豪强消沮同僚悦服則去之之日雖敝車羸馬行橐蕭然其樂有不翅萬金獲而千駟受者前輩由外官而至執政者論濟人之功皆自以為不及為縣逺甚嗚呼有志及物者其勿薄州縣而不屑為也閒居第十輕去就士之仕也有其任斯有其責有其責斯有其憂任一縣之責者則憂一縣任一州之責者則憂一州任一路之責天下之責者則一路與天下為憂也蓋任重則責重責重則憂深古之人所以三揖而進一揖而退者有以也雖堯舜禹湯文武之為君臯䕫稷契伊傅周召之為臣固未嘗不憂其責而以位為樂也彼以位為樂者苟其位者也嗚呼大聖大賢宜不難於其所任猶且不自暇逸如此吾才逺不逮聖賢顧可樂其位而重其去也哉致政古人以休官致政為釋重負而脱羈囚竊嘗思之誠有是理方其仕也嚴出入而慎起居一嚬一笑亦不敢以輕假人蓋一身而為衆師表少踰規矩謗議四聞譬之特行於高屋之上自頂至踵在下者無不見之也一朝代至完身而去詎止如釋重負脱羈囚而已哉嘗見仕而休居者徃徃不喜或命子姪或託朋友市奸搆訟靡政不及小有所違則曰去官同見任使新上者法格令弛拒納難容而撓沮排觝為狀百端細民無知亦從而靡設使已政之初人以是薦擾當若何推心體之必自知其可惡矣進退皆有為進則安居以行其志退則安居以修其所未能則是進亦有為退亦有為也近世士大夫惟狃於進退則惛然無所猷為甚而茹愧懐慙蹙縮不敢一出户夫軒冕古人以為儻来之物也其有也何所加其無也何所損不思良貴在我惟假於物以為重輕焉則其人品之卑下不待論而可知矣以義處命世俗以窮達進退皆本夫命謂命之窮者雖竭蹶求進而亦窮命之達者雖逺逝深藏而亦不能退此星翁術士之常談非君子所尚也君子則以義處命而不以命害義可以進則進可以退則退吾不謂命也樂則行之憂則違之吾豈謂命哉彼淪胥富貴利達之境而不能出者則徃徃託命以自誣宜乎接武禍機而卒不能悟悲夫求進於已士當求進於已而不可求進於人也所謂求進於已者道業學術之精是已所謂求進於人者富貴利達之榮是已蓋富貴利達在天而不可求道業學術在我而不可不求也况古之人不以富貴利逹為心也其所以從仕者宜假此以行道也道不行而富貴利達者古人以為恥而不以為榮嗚呼非誠有致君澤民之心者其孰能與於此風節名節之於人不金幣而富不軒冕而貴士無名節猶女不貞則何暴不從何美不附雖有他美亦不足贖也故前輩謂爵禄易得名節難保爵禄或失有時而再来名節一虧終身不復矣嗚呼士而居閒者能以此言銘其心庶不易所守而趨勢要哉三事忠告卷二欽定四庫全書三事忠告卷三元張養浩撰風憲忠告自律第一士而律身固不可以不嚴也然有官守者則當嚴於士焉有言責者又當嚴于有官守者焉蓋執法之臣將以糾姦繩惡以肅中外以正紀綱自律不嚴何以服衆夫所謂嚴如處子之居室一行一止一語一黙必遵禮法厥徳乃全跬歩有違則人人得而訾之矣茍挾權勢惟殖已私或巧規子錢或盗行鹽鐵或荒躭麴糵或私用親屬或田獵不時或宴遊無度或潛托有司之事或妄興不急之工或曠官第而弗居或縱家人而不檢於斯數者而有一焉皆足為風憲之累近年南北富民多起宅以居勢要因濟已私既有官舎則不必居於彼矣夫國家以中臺為肅政以御史為監察以憲司為㢘訪者欲以糾奸貪戢紛擾開誠布公俾所屬知所法也今而若是牧民之吏將焉法哉且他人有犯輕則吾得而言之又重吾得聞於上而戮之已之所犯其孰得而發哉恃人不敢發日甚一日將如臺察何將如天理何故余備載其然俾為憲司者有則改之無則益知所以自重示教第二甚矣人之不可無教也生如聖人猶胥訓告胥教誨况不能聖人萬一者可忽焉而不務哉大抵常人之情服其所遵而信其所畏非是者雖耳提面命則亦不足以發其良心何則非所素服素畏者故也今夫庶司之職為衆所畏服者莫如風憲誠因監涖於彼或始上之日㑹所屬而朂之曰彼之官重者廷授次者省授又次則吏部授大小雖殊無非國家臣子為人臣子奸汙不法人孰汝容夫納賄營私所得甚少所喪甚多與其事敗而治曷若先事而教之為愈哉吾之此言雖曰薄汝實厚汝也雖若毒汝實恩汝也苟能如是諭之吾知退而必有率徳改行易凶惡為善良者矣且刑罰不足以致治教之而使不犯為治之道莫尚焉聖人謂不教而殺謂之虐又聞治於未然者易治於已然者難近年劉伯宣為浙西憲使疏真西山守令四箴播告所屬且曰近年執憲者惟知成人以刑而不知誨人以善嗚呼劉公此言可謂仁人君子深得風憲之體者矣詢訪第三今為政者徃徃以先入之言為主非彼狃徇一偏蓋由不通上下之情故也欲通其情莫如悉心詢訪小而一縣一州大而一郡一國吏孰貪邪官孰㢘正何事病衆何政利民及豪横有無風俗厚薄既得其凡他日詳加綜覈復驗以事其孰得而隠哉茍㢘矣即優之禮貎薦之舉之則善者勸矣茍貪矣雖極品之貴即蔑之威拒之糾劾之則為惡者懲矣推而至於待士遇吏亦莫不然大抵一道之任猶一家之務焉善為家者其子弟族屬下逮奴隸其情性良否皆所當知一或不及則將甘為所㺯而不悟久而必致是非顛倒以佞為忠以貪為亷以無能為有能政令不行而紀綱替矣前輩有云為宰相不難一心正兩眼明足矣嗚呼彼長風憲者其責任之重亦豈下夫宰相哉若之何不以前軰之言為法按行第四將家云多算勝少算少算勝無算不特用兵為然雖涖官臨政亦莫不爾夫亷司所涖之處一方官吏皆惕然不自安其所不安者由彼為惡日久恐人有以發而訟之一旦故也彼既内隠其惡則必多方以求司官所親之人而解之夫司官所親者曰書吏焉曰奏差焉曰總領焉曰祗候焉夫為人彌縫私罪則何求不得何請不遂為司官者茍不深防預備嚴為禁切萬一連已悔將何及若乃司官亷正猶或庶幾其或彼此胥貪弊將焉救於是乎有箕斂者有稇載者有篋笥充者囊橐盈者凡土所宜靡不搜刮昔端州出佳硯包孝肅公出判於彼及其代也徒手而歸李及知杭州絲餽縷謁不逮門猶有白樂天文集終身以為歉古人持身之㢘如此况在風憲其所行州郡敢假分毫之物以自溷哉大抵憲長得人則司官不敢恣司官得人則書吏不敢恣抑聞各道公宴司官書吏奏差同堂而坐喧譁笑謔上下不分所以致彼操縱自如百無忌憚諺謂亷訪司乃書吏之權即此觀之信匪虚語誠能設法以禁之威武以臨之小有所犯即隨以鞭朴如此庶使精鋭消沮威福不張於外矣凡初入風憲者不可不知審録第五書曰庶獄庶慎又曰非佞折獄惟良折獄易謂君子以明慎用刑而不留獄於戯以此見聖人好生之心與天地等矣夫饑寒切身自非深知義理之人不敢保其心無他况蚩蚩之氓乎為守牧者教養之不至窮而為盗是豈得已哉古人有以灼其然故為制也恒寛緩而不促迫恒哀矜而不忿疾均之為盗也而有長幼疎戚之分均之為姦也而有夫亾夫在之殊有疾則醫藥之疾革則釋梏入人而侍之夫彼冥迷凶險之徒既麗於理矣何足綴意而古人為制如此者則其仁恕忠厚之情可見矣昔歐陽公父治死囚之獄求其生而不得則掩卷而嘆其言曰夫常求其生猶失之死况世常求其死哉後之殘忍者一切不務而惟威刑之尚謂其無茹寃而死者吾不信也夫涖官之法無他口威心善而已矣口威則欲其事集心善則不欲輕易害物况久繫之囚尤當示以慈祥召之稍前易其舊所隸卒吏温以善言使自陳顛末情無所疑然後參乏以案若據案以求其情鮮有不誤人者蓋州縣無良吏不敢信其已具之文毫釐或差生死攸繫故聖人謂與其殺不辜寧失不經又曰功疑惟重罪疑惟輕論囚之道盡於此矣君子其慎諸薦舉第六夫士有公天下之心然後能舉天下之賢盖天下之事非一人所能周知亦非一人所能獨成必兼收博采治理可望焉故前輩謂報國莫如薦賢真知要之言哉今夫富者之治家有田焉必求良農使之耕有貨焉必求能商使之賈有牛羊焉必求善豢者使之牧何則蓋彼拳拳於治家故不得不求其人也况受天下之寄任天下之責者乃不知求天下之才共治之豈其智之不若彼富者哉由其為國之心未嘗如其為家之心之切故也於此有人焉亷而且幹雖有不共戴天之仇公論之下亦不得而私焉世嘗謂風憲非親不保非仇不彈又有身為憲佐風御史薦已就陞者嗚呼委以黜陟百官之權授以儀表百司之職乃不思報效惟假之以行已私人則受其欺矣天地鬼神其受欺乎大抵求而後舉不若不求而舉之為公識而後薦不若采之輿論之為博夫已不求賢必使人之求已者皆非也盖求則不必舉舉則不必識矣故古人有聞而舉者有見而舉者有舉仇者有舉親者有集於簿者有疏諸屏風者有書之夹袋者雖其舉不一要極於公當無私而已於戯誠如是則為相為風憲者安有臨事乏才之嘆糾彈第七夫臺憲之職無内外逺邇之分凡有所知皆得盡言以聞於上雖在外茍知居中者非人糾而言之可也雖在内茍知外官者不法糾而言之亦可也大率期以至公無私斯得之矣夫人之任也有貴近焉有疎逺焉貴近者不少貸則位卑而罪㣲者不待劾而自艾矣故前輩謂豺狼當道安問狐狸亦此意也竊嘗謂薦舉之體則宜先小官糾彈之體則宜先貴官然又當審其素行為君子為小人如誠小人雖有所長亦不必舉何則其平日不善者多也如誠君子雖有小過亦不必言何則其平日之善者多也况刑憲本以待小人君子之過茍不至甚殆不宜輕易害之使數十年作養之功掃地於一旦也蓋人才難得全才為尤難得昔趙清獻公在言路彈劾不避權貴京師號為鐵面御史嘗欲朝廷别白君子小人其言曰小人雖有小過當力排絶之後乃無患君子不幸而有詿誤則當為國家保持愛䕶以全其徳於戲趙公之言可謂深識逺慮真知大體之論矣故余表而出之以為當路者楷式奏對第八中外之官莫難於風憲莫危於風憲曷謂難人之所趨者不敢趨人之所樂者不敢樂人之所私者不敢私所謂嶢嶢者易缺皦皦者易汙非難而何曷謂危入焉與天子爭是非出焉與大臣辨可否至於發人之姦貶人之爵奪人之官甚則罪人於死地一或不察反以為辜則終身無所控訴非危而何然君子居其官則思盡其職所謂危且難者固有所不避焉竭忠吐誠置死生禍福於度外庶上不負所學其或奏對於殿廷之上平心易氣惟事之陳理誠直雖從容宛轉而亦直理誠屈雖􅎨厲激切而亦屈夫悻悻其色辭非惟有失事上之體而於已於事亦無所益古之攀欄斷鞅曵裾軔輪者皆勢危事迫不得已而為之茍事不至是殆不可執以為法前輩謂慷慨殺身者易從容就義者難體此而行則􅌸有不從者矣臨難第九夫人臣而當國家言責之任刑辱之事不敢必其無有要在順處靜俟以理勝之而已若乃求哀乞憐惴讋無所已先挫撓何以自明夫盡已之職為國為民而得罪君子不以為辱而以為榮雖縲紲之椎楚之斧鉞之庸何愧哉歴觀自古處禍患而不亂者三代而下如子路之結纓宜僚之正色黄霸之在獄授書王景之與客奕棋劉褘之自書謝表魏元忠之聞赦不動是皆有以真知義命所在非區區人力所得而移也然士君子平昔所養其深與淺其情與偽於焉可以見之李斯臨刑父子相泣揚子雲被收投閣幾死王坦之與謝安齊名桓温来朝倒執手板崔浩自比子房為辨史事聲嘶股栗溺不能隠此可見彼惟事口耳而於聖賢性命之學實未嘗得諸心也善乎韓文公之言曰儒者之於患難茍非其自取之其拒而不受於懐也若築河堤以障屋霤其容而消之也若水之於海氷之於夏日其玩而忘之以文辭也若奏金石以破蟋蟀之鳴故君子之學以明理自信為貴全節第十人之有死猶晝之必有夜暑之必有寒古今常理不足深諱若為子死於孝為臣死於忠則其為死也大身雖殁而名不没焉太史公謂死有重於泰山有輕於鴻毛非其義則不死所以重於泰山也如其義則一切無所顧所謂輕於鴻毛也嗚呼夫人以眇然之身倐爾之年使之山岳聳而日星揭者非節義能爾耶况人之貴賤夀夭天所素定而謂附此人則得官違此人則失官言事則身危不言則無患此世俗無知者所見士君子豈以是為取舎哉然正直亦有時而被禍者君子以為不幸奸邪亦有時而䝉福者君子以為幸一以為不幸一以為幸則其是非榮辱較然故節義者天下之大閑臣子之盛徳不蕩於富貴不蹙於貧賤不揺於威武道之所在死生以之彼依阿淟涊枉已徇人者所謂無闗得喪徒缺雅道正使獲榮寵於一時迨夫勢移事去其前日之榮電滅風休漠無蹤跡其昭在人耳目者奸佞之名千古猶一日其為辱也庸有既乎嗚呼寧為此而死不為彼而生以是處心庶無愧於古人矣三事忠告卷三欽定四庫全書三事忠告卷四元張養浩撰廟堂忠告修身第一前輩謂仕宦而至將相為人情之所榮是不知榮也者辱之基也惟善自修者則能保其榮不善自修者適足速其辱所謂善自修者何廉以律身忠以事上正以處事恭慎以率百僚如是則令名隨焉輿論歸焉鬼神福焉雖欲辭其榮不可得也所謂不善自修者何徇私􅁯公貪無紀極不戒覆車靡思報國如是則惡名隨焉衆毁歸焉鬼神禍焉雖欲避其辱亦不可得也於戯身為宰相何善不可行何功不可立顧乃為區區之利蠱惑而妄行豈不深可惜哉且自古居相位者未聞死於凍餓而死於財於酒於色於逸樂者無代無之昔諸葛孔明為丞相二十年無尺寸之璔於家未嘗憂其貧竟以勞於王事而卒至今其名之榮常若世享萬鍾而不絶者唐元載為相惟利是嗜及其敗也籍没其家胡椒八百斛至其名之穢常若䝉不潔而播臭無窮者嗚呼夫人以百年之身天假以年不過八十九十姑以八十為率計其得志不過三四十年而已豈有三四十年之間能食胡椒八百斛之理古人謂利令人智昏兹明驗矣嗚呼凡為相者能以諸葛孔明為法唐之元載為戒雖台鼎終身又何悔吝之有用賢第二天子之職莫重擇相宰相之職莫重用賢然則何以知其賢詢諸人則知之察其行則知之觀所舉則知之夫為室而不衆工之資梓人雖巧室不能成矣為國家而不衆賢之集相臣雖才國不治矣彼為相者誠能開誠布公廓焉無我已有不能舉能者而用之已有不知舉知者而用之已有不敢言舉敢言者而用之如是則彼之所能皆我有矣必欲一身而兼衆人之事雖大聖大賢有所不能夫粹白之狐舉世所無有也然而有粹白之裘者善取於衆而已矣况大臣初不貴乎事無不知第公正其心無所媢疾則智者效謀勇者效力呫呫以為才㨗㨗以為辯自􅃷自伐則賢者必不樂為之用大抵人君自伐則臣職有所不行相臣自伐則百執事之職有所不行為人上者操約以馭繁居靜以制動以無心而應天下之心則所令者從所庸者勸茍知其賢而任之既任而疑之而務勝之顧與不知不用自任其才也奚異若然則體統失而諂佞之小人至矣與小人處則天下之事不論可知吁重民第三蓋聞古之王者授版則拜竊意萬乗之尊為其民貶抑若是嘗疑焉而不取既而思之國之所以昌四夷之所以靖朝廷之所以隆宗廟社稷所以血食悠久者㣲民不能爾也夫天以億兆之命託之君君以億兆之命託之相是知相也者為君保民者也君也者為天為祖宗保民者也天以是託我祖宗祖宗以是託我敢不敬歟敢不慎歟茍受其託而不能使之遂生安業乃從而擾之虐之犬彘之草菅之則是逆天而違祖宗之命以自戕其國也而可乎彼為民者固不敢與校然於天之心於祖宗之心其能無所戚歟嘗謂愛民者無過於天無過於祖宗天生之難祖宗得之為尤難王者知其如是凛凛焉未嘗不以民生為重聞其害而除之覩其利則舉之牧守非其人則易置之今夫鷹師圉人所掌者不過人主服御之一物而人尚以内侍重之刺史縣令乃為祖宗為國家牧養斯民者反視為不切而慢卑之是愛民不如鷹犬受祖宗國家一方生靈之寄者反不如内侍豈不顛倒失體哉大抵下之所為惟上是視在上者誠有重民之心而天下不治者古今無有也逺慮第四天下之事知其已然不知其將然者衆人也因其已然而將然未然逆而知之非深識逺慮者不能室已焚而徙薪舟已溺而市壺疾已成而求艾雖殫力為之無及矣今夫隆然之堤有容蟻之穴宜若無所損然周於識者必塞而實之慮其久而必底於訌潰故也天下之事皆能如是慮之尙何後患之有哉大抵自古國家之所以不治臣子之所以不軌固非一朝一夕之積良由今日以某事為小過而不諌明日以某人為小罪而不懲日引月深不自知其禍亂之成也故臣之於君獻可替否而不敢萌一毫姑息之心始以為無傷卒至大可傷始以為不足慮卒至深可慮惟君子為能見㣲知著思患而預防之於飲宴則防流連於田獵則防荒縱於營繕則防踰制於貨財則防損民於爵賞則防僣及於刑法則防濫殺於君子則防踈遠於小人則防玩狎於聼覧則防容奸於征伐則防黷武夫君之於臣亦有所當遠慮者雖愛而不錫以過分之賞雖舊而不授以非據之官雖親而不交以䙝瀆之談蓋尊卑之分嚴則上下之體定上下之體定則禍亂無自而生天下之事可次第而治矣調燮第五人皆曰燮理隂陽為宰相事然舉世第能道其辭迄不知隂陽何術可以燮理按書周官三公論道經邦燮理隂陽蓋周之三公即今宰輔而漢丞相平亦曰宰相上佐天子理隂陽順四時厥後又有災異免三公之制世俗所云蓋本諸此竊嘗即是以思宰相所以調燮者非能旱焉而使之雨雨焉而使之𤾉要不越盡人事以来天地之和而已矣夫天之與人若判然而實相表裏蓋政事順則民心順民心順則天地之氣順天地之氣順則隂陽從而序矣若乃怙勢立威挾權縱欲惡人異已諂佞是親於所言者不言於所救者不救上下相䝉惟務從命如此欲望民心順隂陽之氣和難矣大抵天道之災祥視民心之苦樂民心之苦樂視政事之失得政事之失得視宰相之賢與不賢昔丙吉舎死人問牛喘自以為得體殊不知天道逆順當於政事觀之固不在區區一牛之喘與否也晉庾氷為相或謂天文錯度宜盡消禦之道氷曰𤣥象豈無所測正當勤盡人事氷之此言可謂簡明切要深得宰相之體者矣茍政事修整雖隂陽之和不應乃天道之變也又何歉焉茍政事龎焉棼焉而不理雖禎祥集而風雨時若顧敢以為治乎嗚呼凡為相者誠能以是求之則天人之理瞭然矣任怨第六夫為人臣惟欲收名而不敢任怨此不忠之尤者也居廟堂之上凡有所為惟當揆之以義義茍不失悠悠之言奚恤哉今夫兩軍之交兵刃叢前而心誠報國者尚冒之而不顧夫臨政之與臨敵其安危利害相距霄壤此猶顧惜抑不知於萬死一生之際為何如昔范文正公患諸路監司非人視選簿有不可者輒筆勾之或謂一筆退一人則是一家哭矣公曰一家哭其如一路哭何嗚呼如是處心斯不負宰相之職矣大抵天下之事有易有難有利有害難而有害者人多辭避利而易行者人多忻然以為殊不知官有長佐之分體有勞逸之殊長者逸而佐者勞此天地之大義也以朝廷言之君上逸而臣下勞以一家言之父母逸而子弟勞以一身言之頭目逸而手足勞嗚呼人而知此者必不遺君父以憂措其長於衆怨之地矣近代為執政者徃徃姑息好名一疾言厲色不敢加於人事或犯衆激使居已之右者發之嗚呼夫治家而使父母任其勞為國家而使君長任其怨尚得為忠孝乎哉况有罪不責有善不旌雖三代不能為治故刑罰不患於用直患乎用之而不公昔桓公奪伯氏駢邑三百没齒而無怨言諸葛孔明廢廖立而立聞亮死輒泣下為宰相誠能公其心如是則天下蔑有不服者矣分謗第七夫共署聫事一人努力而前則餘者皆當輔相以成其志苟彼前我却彼行我止動焉而不相隨語焉而不相應則事功之成者能幾此古人所以有推車同舟之喻也其或共舟以濟而一人溺焉則凡在舟者無論疏戚所宜幷力以救之此賢不肖之所共知也况同為臣子同受天下國家之寄者可坐視一人被禍而不恤哉使其為一已之私自貽伊戚固無足恤其或知無不言言無不盡公家之務一以大公至正處之彼非為已為家而得罪則凡同官者安得不挺身而前與之共難也哉大抵一人不幸而得罪為長者若曰此我之罪為貳者亦曰此我之罪使闔堂之人皆爭引為已罪則彼獲罪者雖不能釋亦必不至於重論矣古之敢於諌爭者其遇不見聽納至謂與其殺此人不若殺臣尚為如此求解其肯坐視同官寃抑而不省哉嗚呼使分謗引咎之事為宰相者誠能力行於今將見士大夫之名節愈厲民間之薄俗可敦而國家他日亦不患其無仗義死節之士矣一事之行所繫如此孰謂任怨分謗為宰相細行哉應變第八事機之發有常有變常者中人處之而有餘變者雖上智亦有所不足樽爼之下卒然而報兵遽然而聞冦則當詳其虚實度其逆順殆不可一聞其言輒倉惶上變徵發百出未見敵而先自撓也且事固有聲虚以釣實乘間以拘利傳㣲為巨以無形為有形疑似之間不可不察若夫國有大奸境有大敵彼既非常而吾則以非常之計備之若乃泥文守經終見動輒有礙而事亦無所濟矣故古人遇此權以濟才隨宜制變如丸轉於盤而不出於盤如水委曲赴海而不悖於海王商聞大水之言君臣皆驚而商獨必其無事桓温將移晉祚聲誅王謝而謝安雍容談笑以折其鋒囘紇吐蕃合兵涇陽郭子儀單騎以徃喻蓋宰相者非常之任也居非常之任獨不能為非常之事可乎故前輩謂鎮定大事非至公至誠不能或死或生舉置度外嗚呼世常以大臣國家柱石者其謂兹歟獻納第九人臣之納言於君也事未然而言之則十從八九無事則游畋般樂日相親比一旦有所不可乃左遮右挽極其力以救之殆未見其濟者正使或允亦必出於勉强而非其本心若夫善於納言者則不然或因進見或因講讀或自燕居先事陳説如是則國安如是則國危如是則為聖君如是則為暴主或引古昔或援祖宗必使之心悟神㑹表裏洞然乃可陳善而無扞格之患昔孟子三見齊王而不言事曰我先攻其邪心大臣事君職當如此古人甚至有難於自言者徃徃旁召耆年宿徳置諸左右使人君有所畏憚而不敢恣則其為慮亦深逺矣雖然臣之於君也入則懇懇以盡忠出則謙謙以自悔凡所白於上者不可洩於外而伐諸人善則歸君過則歸已其若是者非欲逺嫌避禍大臣之體所當然也坤之六二含章可貞盖亦此意嘗見近代執政有所建白呶呶焉惟恐人之不知卒至讒譖乘之中途見棄易大繫所謂君不宻則失臣臣不宻則失身諒哉退休第十博施兼善士君子通願也然有志而無才則不能有才而無位則不能有位而不見知於上則不能見知矣而小人間之則不能嗚呼此士大夫所以出而用世之難也上焉恥其君不及堯舜下焉思一夫不被其澤若已推而納諸溝中世俗所樂若聲色若宫室若珍異車服之奉一皆無有其所有者自頂至踵天下國家之憂而已為君上者誠能亮其如是之懐凡有所言優容喜納猶或庶幾其或疑其奪權違已賣直售名將見舉動皆愆而身死無所矣所以自古忠直為國者少阿容佞詐惟已之為者多此無他蓋由為已則有福而無禍為國則
