  - {type: variant, offset: 3704, length: 1, content: 經, WYG: 失其道民散久矣如得其情則哀矜而勿喜嗚呼人能以是論囚雖欲慘酷亦必有所不忍矣獄詰其初獄問初情人之常言也蓋獄之初發犯者不暇藻飾問者不暇鍛錬其情必真而易見威以臨之虚心以詰之十得七八矣少萌姑息則其勞將有百倍厥初者故片言折獄聖人惟與乎子路其難可知矣詳讞在獄之囚吏案雖成猶當詳讞也若酷吏鍛鍊而成者雖讞之囚不敢異辭焉須盡辟吏卒和顔易氣開誠心以感之或令忠厚獄卒欵曲以其情問之如得其寃立為辨白不可徒拘閡吏文也噫姦吏舞文何所不至哉視屍故事承檢屍之牒則劃時而行重人命也其或行焉而後時時焉而不親涖親焉而不精詳罪皆不輕也其檢之之式又當徧考筮仕者不可以不知囚糧天地之徳曰好生聖朝體之以有天下諸在縲紲無家者皆給之糧惟縣獄不給也意者縣非待報之官府故令略詰其然而上之州比見為州者徃徃為吏之所欺吹求不受以致瘐死於縣獄夫罪不至死而以已私繆殺之不仁甚矣為州若府者尙深戒之巡警詰盗非難而警盗為難警盜非難而使民不為盜尤難蓋天下之事先其幾為之則有餘後其幾為之則艱苦而無益夫盗之發也恒出不虞知者防於未然其防之之術則在廣耳目嚴巡邏戒飲博禁游聚或旬或月即命尉行境以恐懼之夫盗猶鼠也尉猶捕鼠之貍也勤於出鼠必伏而不動貍怠出則鼠必興矣彼為尉者與其勞於已然孰若警於未發之為愈若夫使民不為盗則又在於勤本以致富勤斯富富斯禮義生禮義生雖驅之使竊亦必不肯為之矣故管子謂倉廪實而知禮節衣食足而知榮辱諒哉按視獄庭時當一至也不惟有以安衆囚之心亦使司獄卒吏輩知所警畏而無飲博喧嘩逸而反獄者是亦先事防之之㣲意也倉庫同哀矜亾友段伯英嘗尹鉅野民有犯法受刑者每為泣下或以為過余聞之私自語曰人必有是心然後可以語王政且獨不聞古人亦有禁人於獄而不家寢者乎要皆良心之所發非過也非縱囚古人縱囚省親如期還獄者甚多要不可以為法也夫法者天子之所有而民或犯之是犯天子之法也而彼乃與期而縱之是不幾於㺯天子之法以掠美市恩於下者乎然出於朝廷則可出於一已之私則不可自責教民不至則犯禁者多養民無術則病饑者衆為守與牧而使其至此獨歸咎於民難矣哉救荒第七捕蝗故事蝗生境内必馳聞於上少淹頃刻所坐不輕然長民者亦須相其小大多寡為害輕重若遽然以聞涖其上者羣集族赴供張徴索一境騷然其害反甚於蝗者其或勢㣲種穉則當亟率衆力以圖之不必因細虞以来大難於民也故凡居官必先敢於負荷而後可以有為多方救賑天所畀人富與貴者非欲其自裕蓋將使推所有以濟人之不及也饑者食之寒者衣之斯不負天畀之富矣直者舉之枉者錯之斯不負天畀之貴矣然富貴而能若是者其恵在人而善則在已名為恵人實自恵也故古之有民社者或不幸而值㐫荒夭扎之變視其輕重必有術以處之或私帑之分或公廪之發或託之工役或假以山澤或已負蠲征募糴勸糶或聽民收其遺稚或命醫療其疹疾凡可以拯其生者靡㣲不至蓋古人視民如子天下未有子在難而父母坐視不救之理也嗚呼凡牧民者其以古之人為法庶無彼我之間哉預備災異之生常出於人之所不意誠素有其備雖甚災不足為憂也今州郡多無委積雖有之而在上者封錮甚嚴不測有虞茫無所措手此厥今牧民者之通患也然今所謂祗應之錢者山州僻縣未嘗有之而使客徃還率無枵腹而過者意必有以規畫也至於備荒之儲獨未有及焉者豈以治平之時何遽有此所以因仍嵗月幸滿而去不復為民逺慮耶嘗聞近代為縣者教民種蔓菁摀其根以為餅大者三四斤乾而儲之後值㐫年蒸以食饑民味甘且美賴以全活者甚衆夫古人慮民之周也如此其肯苟且幸代而不為民預備㦲均賦故事民之税賦三年則第其貧富而均平之或好名未及而先為或避謗踰期而不為皆非也如期行之民受賜不淺矣祈禱凡有祈禱不必勞衆齋居三日以思已愆民有寃歟已有贓歟政事有未善歟報國之心有未誠歟無則如儀行事有則必俟追改而後禱焉夫動天地感鬼神非至誠不可纎毫之惡未除則彼此邈然矣不可奴妾流民嘗見一顯官於凶年市所部民子女殆數十餘人美且壯者皆奴妾之餘將賂時要以希恩寵也僕聞而顰蹙曰使其困憊吾治已得罪矣又不能救而反奴妾之不大獲罪於法耶故感而書之以戒後來者救焚民或失火則伐皷集衆親涖以救之惻隠之心人所共有誠能皷舞以作其氣雖仇人亦將焦頭爛額而相趨患難矣尙徳反風㓕火虎渡河蝗不入境金境之水囘流此在長民者之徳何如耳殆不可皆謂之偶然也上災異災異之事則不可不聞祥瑞雖不上可也事長第八各守涯分尊卑之分定則家無逆子國無叛臣夫國之所以亾家之所以敗皆由卑不有尊而尊不能制卑之所致也考諸歴代厥監甚明今夫上而朝廷下而郡邑其設官也有長焉有貳焉有幕屬焉有胥吏焉各安其分而事其事天下安有不治者哉惟其小智自私乖同寅之義無協恭之誠衷既不和則所見必有不同者以長官不知待佐貳之禮也或佐貳闇於事長官之道也少見辭色則彼此胥失矣若夫事例應爾而所見或不同居下者當誠其意婉其辭卑其容體以開其上若猶未允則俟其退而語之家人非木石無不囘之理其或居下者有所不可為長者亦當如是曉之也稍有所挾雖面强從退而必有不堪者日引月深終於洩露人見其乖忤也讒譖之言乘之而入入則訟必興而政事隳矣為一時之忿使同僚之心離闔境之民不得治則其人之褊淺可知矣古人有言必有忍乃其有濟又曰欲成大事必須少忍又曰忍為衆妙之門㫖哉寧人負我寧人負我無我負人此待已之道也天下之善不必已出此待人之道也能行斯二者於道其庶幾乎處患難凡在官者當知榮與辱相倚伏得與失相勝負成與敗相循環古今未有榮而無辱得而無失成而無敗之理也雖天地之運隂陽之化物理人事莫不皆然處之不以道則纎毫之寵必揺而一唾之辱必挫矣故君子於外物輕重皆所不恤顧其在我者何如爾使其有可辱雖不加譴而君子恒以為不足使其無可辱雖置之死地而君子恒以為有餘歴觀自昔大聖大賢不幸横罹禍患恬然不易其素者灼乎此而已矣茍惟能處榮而不能處辱惟能安順境而逆境則不能一朝居欲望其臨政有餘為難矣嗚呼善觀人者其於此焉察之分謗是非毁譽自古為政所不能無者是則歸人非則歸已聞譽則歸人聞毁則歸已無長無貳處之皆當如是也前輩云恩欲已出怨將誰歸嗚呼此真博大君子之言也以禮下人夫能下人者其志必髙其所至必逺昔某郡有新守褊驁大不禮其下常令掾屬羅拜於庭下有一賢掾初以疾在告疾愈當庭參是日偶大雨守命張傘布茅於庭下使掾拜焉掾恬然不動容興伏惟謹識者知其他日必為宰相也後果然不可以律已之律律人同官有過不至害政宜為包容大抵律已當嚴待人當恕必欲人人同已天下必無是理也受代第九郊迎新代聞代者来則避所居而郊迎之不可以其代已也而疾之而薄之而不以舊政告之也大抵天下之善在彼猶在此勸人為善即已之為善也詎可惟許已為善而不願他人為善哉克終為政者不難於始而難於克終也初焉則鋭中焉則緩末焉則廢者人之情也慎終如始故君子稱焉不競當見世之交代者多有所爭要皆舊官不廣之所致或據其居而不徙或専其田而不分或匿其公物不盡以相授使新者懐不平而無所訴甚非士君子善後之道也夫利之與義勢不並處義親則利䟽利近則義逺况為民師帥而専務於利其聚怨納侮視市井小人不若也故君子之從政也寧公而貧不私而富寜讓而損已不競而損人不可自鬻代之未至也風民立石以頌徳結綺門以祖行鳩錢帛以佐路費建生祠以圖不朽之名皆非士君子之事也蓋為善不求人知者為上知而不自有其善者次之呶呶焉自媒自鬻惟崇虚譽者風斯在下矣告以舊政近代東原吴曼慶為某所憲長既代諄諄告上者曰某事有少許未完某獄已具而未决某案有如是可疑某人有許能而可用一部之政毫分縷析惟恐其不知知之惟恐其不盡嗚呼今之仕者方其在職尚不肯用心况已代去而敢責其如是哉完歸其在政也民被徳澤訟清盗息豪强消沮同僚悦服則去之之日雖敝車羸馬行橐蕭然其樂有不翅萬金獲而千駟受者前輩由外官而至執政者論濟人之功皆自以為不及為縣逺甚嗚呼有志及物者其勿薄州縣而不屑為也閒居第十輕去就士之仕也有其任斯有其責有其責斯有其憂任一縣之責者則憂一縣任一州之責者則憂一州任一路之責天下之責者則一路與天下為憂也蓋任重則責重責重則憂深古之人所以三揖而}
  - {type: indent, offset: 3705, content: 　, id: KR2l0021_krp_001-bkkind47}
  - {type: variant, offset: 3706, length: 0, content: '', WYG: 一揖而退者有以也雖堯舜禹湯文武之為君臯䕫稷契伊傅周召之為臣固未嘗不憂其責而以位為樂也彼以位為樂者苟其位者也嗚呼大聖大賢宜不難於其所任猶且不自暇逸如此吾才逺不逮聖賢顧可樂其位而重其去也哉致政古人以休官致政為釋重負而脱羈囚竊嘗思之誠有是理方其仕也嚴出入而慎起居一嚬一笑亦不敢以輕假人蓋一身而為衆師表少踰規矩謗議四聞譬之特行於高屋之上自頂至踵在下者無不見之也一朝代至完身而去詎止如釋重負脱羈囚而已哉嘗見仕而休居者徃徃不喜或命子姪或託朋友市奸搆訟靡政不及小有所違則曰去官同見任使新上者法格令弛拒納難容而撓沮排觝為狀百端細民無知亦從而靡設使已政之初人以是薦擾當若何推心體之必自知其可惡矣進退皆有為進則安居以行其志退則安居以修其所未能則是進亦有為退亦有為也近世士大夫惟狃於進退則惛然無所猷為甚而茹愧懐慙蹙縮不敢一出户夫軒冕古人以為儻来之物也其有也何所加其無也何所損不思良貴在我惟假於物以為重輕焉則其人品之卑下不待論而可知矣以義處命世俗以窮達進退皆本夫命謂命之窮者雖竭蹶求進而亦窮命之達者雖逺逝深藏而亦不能退此星翁術士之常談非君子所尚也君子則以義處命而不以命害義可以進則進可以退則退吾不謂命也樂則行之憂則違之吾豈謂命哉彼淪胥富貴利達之境而不能出者則徃徃託命以自誣宜乎接武禍機而卒不能悟悲夫求進於已士當求進於已而不可求進於人也所謂求進於已者道業學術之精是已所謂求進於人者富貴利達之榮是已蓋富貴利達在天而不可求道業學術在我而不可不求也况古之人不以富貴利逹為心也其所以從仕者宜假此以行道也道不行而富貴利達者古人以為恥而不以為榮嗚呼非誠有致君澤民之心者其孰能與於此風節名節之於人不金幣而富不軒冕而貴士無名節猶女不貞則何暴不從何美不附雖有他美亦不足贖也故前輩謂爵禄易得名節難保爵禄或失有時而再来名節一虧終身不復矣嗚呼士而居閒者能以此言銘其心庶不易所守而趨勢要哉三事忠告卷二欽定四庫全書三事忠告卷三元張養浩撰}
