  - {type: variant, offset: 2552, length: 496, content: 以律已之律律人同官有過不至害政宜爲包容大抵律已當嚴待人當恕必欲人人同已天下必無是理也受代第九郊迎新代聞代者來則避所居而郊迎之不可以其代已也而疾之而薄之而不以舊政告之也大抵天下之善在彼猶在此勸人爲善即已之爲善也詎可惟許已爲善而不願他人爲善哉克終爲政者不難於始而難於克終也𥘉焉則銳中焉則緩末焉則廢者人之情也愼終如始故君子稱焉不競甞見丗之交代者多有所争要皆舊官不廣之所致或據其居而不徙或專其田而不分或匿其公物不盡以相授使新者懐不平而無所訴甚非士君子善後之道也夫利之與義勢不並處義親則利䟽利近則義逺况爲民師帥而專務於利其聚怨納侮視市井小人不若也故君子之從政也寧公而貧不私而富寜讓而損已不競而損人不可自鬻代之未至也風民立石以頌德結綺門以祖行鳩錢帛以佐路費建生祠以圖不朽之名皆非士君子之事也蓋爲善不求人知者爲上知而不自有其善者次之呶呶焉自媒自鬻惟崇虚譽者風斯在下矣告以舊政近代東原吴曼慶爲某所憲長旣代諄諄新上者曰某事有少許未完某獄已具而未决某按有如是可疑某人有許能可用一部之政毫分縷析惟恐其不知知之惟恐其不盡嗚呼今之仕者方其在職尚不肯用心况已代去而敢責其如是哉完歸其在政也民被德澤訟清盗息豪強消沮同僚恱服, WYG: ''}
