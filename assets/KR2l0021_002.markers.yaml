  - {type: variant, offset: 342, length: 5, content: 劃時而行重, WYG: 去為}
  - {type: variant, offset: 348, length: 1471, content: 命也其或行焉而後時時焉而不親蒞親焉而不精詳罪皆不輕也其檢之之式又當徧者筮仕者不可以不知囚糧天地之德曰好生聖元體之以有天下諸在縲紲無家者皆給之粮惟縣獄不給也意者縣非待報之官府故令畧詰其然而上之州比見爲州者往往爲吏之所欺吹求不受以致瘐死於縣獄夫罪不至死而以已私繆殺之不仁甚矣爲州若府者尚深戒之巡警詰盗非難而警盗爲難警盗非難而使民不爲盗尤難蓋天下之事先其幾爲之則有餘後其幾爲之則艱苦而無益夫盗之發也恒岀不虞知者防於未然其防之之術則在廣耳目嚴巡邏戒飲博幾游聚或旬或月即命尉行境以恐懼之夫盗猶鼠也尉猶捕鼠之狸也勤於岀鼠必伏而不動狸怠出則鼠必興矣彼爲尉者與其勞於已然孰若警於未發之爲愈若夫使民不爲盗則又在於勤本以致富勤斯富富斯禮義生禮義生雖駈之使竊亦必不肯爲之矣故管子謂倉廪實而知禮節衣食足而知榮辱諒哉按視獄庭時當一至也不惟有以安衆囚之心亦使司獄卒吏輩知所警畏而無飲博喧嘩逸而反獄者是亦先事防之之㣲意也倉庫同哀矜亡友段伯英甞尹鉅野民有犯法受刑者每爲泣下或以爲過余聞之私自語曰人必有是心然後可以語王政且獨不聞古人亦有禁人於獄而不家寢者乎要皆良心之所發非過也非縱囚古人縱囚省親如期還獄者甚多要不可以爲法也夫法者天子之所有而民或犯之是犯天子之法也而彼乃與期而縱之是不幾於弄天子之法以掠美市恩於下者乎然出於朝廷則可出於一已之私則不可自責教民不至則犯禁者多養民無術則病飢者衆爲守與牧而使其至此獨歸咎於民難矣哉救荒第七凢九條捕蝗故事蝗生境内必馳聞於上少淹頃刻所坐不輕然長民者亦須相其小大多寡爲害輕重若遽然以聞蒞其上者群集族赴供張徴索一境騷然其害反甚於蝗者其或勢㣲種穉則當亟率衆力以圖之不必因細虞以來大難於民也故凢居官必先敢於負荷而後可以有爲多方救賑天所卑人富與貴者非欲其自𥙿蓋將使推所有以濟人之不及也飢者食之寒者衣之斯不負天卑之富矣直者舉之枉者錯之斯不負天卑之貴矣然富貴而能若是者其恵在人而善則在已名爲惠人實自惠也故古之有民社者或不幸而值㐫荒夭扎之變視其輕重必有術以處之或私帑之分或公廪之發或託之工役或假以山澤或已負蠲征募糴勸糶或聽民收其遺稚或命醫療其疹疾凡可以拯其生者靡㣲不至蓋古人視民如子天下未有子在難而父母坐視不救之理也嗚呼凡牧民者其以古之人爲法庻無彼我之間哉預備灾異之生常岀於人之所不意誠素有其備雖甚灾不足爲憂也今州郡多無委積雖有之而在上者封錮甚嚴不測有虞茫無所措手此厥今牧民者之通患也然今所謂祗應之錢者山州僻縣未甞有之而使客往還率無枵腹而過者意必有以規畫也至於備荒之儲獨未有及焉者豈以治平之時何遽有此所以因仍嵗月幸滿而去不復爲民逺慮耶甞聞近代爲縣者教民種蔓菁搗其根以爲餅大者三四斤乾而儲之後值㐫年蒸以食飢民味甘且美頼以全活者甚衆夫古人慮民之逺也如此其肯苟且幸代而不爲民預備哉均賦故事民之稅賦三年則第其貧富而均平之或好名未及而先爲或避謗踰期而不爲皆非也如期行之民受賜不淺矣祈禱凢有祈禱不必勞衆齋居三日以思已愆民有冤歟己有贓歟政事有未善歟報國之心有未誠歟無則如儀行事有則必俟追攺而後禱焉夫動天地感鬼神非至誠不可纎毫之慝未除則彼此邈然矣不可奴妾流民甞見一顯官於㐫年市所部民子女殆數十餘人美且壯者皆奴妾之餘將賂時要以希恩寵也僕聞而顰蹙曰使其困憊吾治巳得罪矣又不能救而反奴妾之不大獲罪於法耶故感而書之以戒後來者救焚民或失火則伐鼓集衆親蒞以救之惻隠之心人所共有誠能鼓舞以作其氣雖仇人亦將焦頭爛額而相趨患難矣尙德反風㓕火虎渡河蝗不入境全境之水囬流此在長民者之德何如爾殆不可皆謂之偶然也上災異災異之事則不可不聞祥瑞雖不上可也事長第八凢五條各守涯分尊卑之分定則家無逆子國無叛, WYG: ''}
