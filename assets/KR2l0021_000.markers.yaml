  - {type: variant, offset: 403, length: 302, content: 序牧民忠告目録卷上拜命凢六條省已克性之偏戒貪民職不宜泛授心誠愛民智無不及法律爲師上任凢六條事不預知難以應卒受謁治官如治家瘴說禁家人侵漁告廟聽訟凢十條察情弭訟勿聽讒親族之訟宜緩别強弱待問者勿停留㑹問妖言民病如已病移聽御下凢五條御吏約束待徒隷省事威嚴宣化凢十條先勞申舊制明綱常勉學勸農服逺恤鰥寡戢強示勸毁淫祠卷下愼獄凢十條存恕獄詰其𥘉詳讞視屍囚粮廵警按視哀矜非縱囚自責救荒凢九條捕蝗多方救賑預俻均賦祈禱不可奴妾流民救焚尚德上災異事長凢六條各守涯分寧人負我處患難分謗以禮下人不可以律己之律律人受代凢六條郊迎新代克終不競不可自鬻告以舊政完歸居閑凢六條輕去就致政進退皆有爲以義處命求進於已風節牧民忠告目録終風憲忠告, WYG: ''}
